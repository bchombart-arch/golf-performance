        $("statsFrom").value=from;
        $("statsTo").value=to;
        $("statsSector3").click();
      });
    }
  }
  labels.forEach(function(label,i){
    $("statsSector"+i).onclick=function(){section=i;render();};
  });
  $("statsFrom").onchange=render;
  $("statsTo").onchange=render;
  render();
}
function sectorStats(section,rounds){
  var sgKeys=[["Putting"],["Départ"],["Départ","Approches","Petit jeu"]][section];
  function total(items,field){
    return items.reduce(function(sum,item){return sum+item[field];},0);
  }
  function roundScore(item){return sgKeys.reduce(function(sum,key){return sum+item.metrics.SG[key].v;},0);}
  function ratio(n,d){return d?n+'/'+d+' · '+Math.round(100*n/d)+' %':"—";}
  var shots=rounds.flatMap(function(item){return item.round.holes.flatMap(function(h){return h.shots;});});
  var ts=rounds.map(function(item){return item.totals;});
  var body='<p>'+rounds.length+(rounds.length===1?' partie complète':' parties complètes')+'</p>';
  if(sgKeys){
    var sg=rounds.reduce(function(sum,item){return sum+roundScore(item);},0);
    body+='<p><b>'+sgFmt(sg/rounds.length)+' SG / tour</b> · '+sgFmt(sg)+' SG total</p>'+
      '<p class="muted">'+sgBenchmarkLabel()+'. Pénalités comptées séparément.</p>';
  }
  if(section===0){
    var putts=rounds.flatMap(function(item){return item.metrics.putts;});
    var missed=putts.filter(function(putt){return putt.res!=="IN";});
    var short=missed.filter(function(putt){return putt.res&&putt.res[0]==="C";}).length;
    var long=missed.filter(function(putt){return putt.res&&putt.res[0]==="L";}).length;
    var leaves=missed.filter(function(putt){return Number.isFinite(putt.rest);});
    body='<h3>Tendance du putting</h3><p>'+rounds.length+
      (rounds.length===1?' partie complète':' parties complètes')+'</p>'+
      '<div class="putt-kpis"><div><b>'+(putts.length?sgFmt(sg/putts.length):"—")+'</b>SG / putt</div>'+
      '<div><b>'+sgFmt(sg/rounds.length)+'</b>SG / tour</div>'+
      '<div><b>'+putts.length+'</b>Putts</div><div><b>'+sgFmt(sg)+'</b>SG total</div></div>'+
      '<p class="muted">'+sgBenchmarkLabel()+'</p>'+
      '<p>Ratés : '+short+' courts · '+long+' longs'+
      (leaves.length?' · '+fmt(total(leaves,"rest")/leaves.length)+' m restants en moyenne ('+leaves.length+')':'')+'</p>';
    return '<div class="card">'+body+sgTrendTable(rounds,roundScore)+'</div>'+puttingCharts(putts,true);
  }
  if(section===1){
    var drives=rounds.flatMap(function(item){
      var pars=course(item.round).pars;
      return item.round.holes.map(function(h,i){return pars[i]>3?h.shots[0]:null;})
        .filter(function(shot){return shot&&shot.type==="long"&&shot.lie==="Départ";});
    });
    var classified=drives.filter(function(s){return !!s.to;});
    var columns=[
      {label:"Ratés à gauche",count:classified.filter(function(s){return s.side==="G"&&s.to!=="Fairway";}).length},
      {label:"Fairways touchés",count:total(ts,"fw"),fairway:true},
      {label:"Ratés à droite",count:classified.filter(function(s){return s.side==="D"&&s.to!=="Fairway";}).length}
    ];
    var other=classified.length-columns.reduce(function(sum,column){return sum+column.count;},0);
    body+='<h3>Dispersion au départ</h3><div class="drive-chart">'+columns.map(function(column){
      var share=classified.length?Math.round(100*column.count/classified.length):0;
      return '<div class="drive-column'+(column.fairway?' fairway':'')+'"><b>'+column.count+
        (classified.length?' · '+share+' %':'')+'</b><div class="drive-plot" aria-hidden="true">'+
        '<span style="height:'+share+'%"></span></div><span>'+column.label+'</span></div>';
    }).join("")+'</div><p class="muted">'+classified.length+' départs avec résultat'+
      (other?' · '+other+' ratés sans côté renseigné':'')+
      (drives.length>classified.length?' · '+(drives.length-classified.length)+' départs sans résultat':'')+'</p>';

  }
  if(section===2){
    body+='<p>Greens en régulation <b>'+ratio(total(ts,"gir"),total(ts,"girN"))+'</b></p>'+
      sgKeys.map(function(key){
        var sum=rounds.reduce(function(acc,item){return acc+item.metrics.SG[key].v;},0);
        return '<p>'+key+' <b>'+sgFmt(sum)+' SG</b></p>';
      }).join("")+'<p>Pénalités '+shots.filter(function(shot){return shot.type==="penalty";}).length+'</p>';
  }
  if(section===3){
    var saves=0, opportunities=0, lies={};
    rounds.forEach(function(item){
      var pars=course(item.round).pars;
      item.round.holes.forEach(function(h,i){
        if(greenIn(h)<=pars[i]-2) return;
        var shot=h.shots.slice().reverse().find(function(s){return s.type==="long";});
        var lie=shot&&shot.lie||"Non renseigné";
        var group=lies[lie]||(lies[lie]={saves:0,n:0});
        opportunities++;group.n++;
        if(nShots(h)<=pars[i]){saves++;group.saves++;}
      });
    });
    body+='<p>Pars ou mieux après un green manqué en régulation <b>'+ratio(saves,opportunities)+'</b></p>'+
      Object.keys(lies).map(function(lie){
        return '<p>'+escapeHistoryText(lie)+' · '+ratio(lies[lie].saves,lies[lie].n)+'</p>';
      }).join("");
  }
  if(sgKeys) body+=sgTrendTable(rounds,roundScore);
  return '<div class="card">'+body+'</div>';
}
function sgTrendTable(rounds,roundScore){
  return '<h3>Évolution par tour</h3><table class="sum"><thead><tr><th>Date</th><th>SG</th></tr></thead><tbody>'+
    rounds.slice().sort(function(a,b){return (a.round.date||"").localeCompare(b.round.date||"");})
      .map(function(item){return '<tr><td>'+displayRoundDate(item.round.date)+'</td><td>'+sgFmt(roundScore(item))+'</td></tr>';}).join("")+
    '</tbody></table>';
}

function paintRoundReport(round){
  var pars=course(round).pars;
  function reportPar(i){return pars[i]||0;}
  show("Bilan");
  $("hTitle").textContent="Bilan du tour";
  var t=totals(round);
  var g=round.green||{};
  $("hSub").textContent=(round.type||"Partie amicale")+" · "+course(round).name+" — départ "+tee(round).name+
    (round.date?" · "+displayRoundDate(round.date):"")+(g.stimp?" · stimp "+String(g.stimp).replace(".",","):"")+(g.qual?" · green "+g.qual.toLowerCase():"");
  var missed=0,withReason=0,three=0,courts=0,longs=0,gauche=0,droite=0,nputts=0;
  var byPar={3:{n:0,c:0,p:0},4:{n:0,c:0,p:0},5:{n:0,c:0,p:0}};
  round.holes.forEach(function(h,i){
    if(h.done&&byPar[reportPar(i)]){ byPar[reportPar(i)].n++; byPar[reportPar(i)].c+=nShots(h)-reportPar(i); byPar[reportPar(i)].p+=nPutts(h); }
    if(nPutts(h)>=3) three++;
    h.shots.forEach(function(s){
      if(s.type!=="putt") return; nputts++;
      if(s.res!=="IN"){
        missed++;
        if(s.read||(s.exec&&s.exec.length)||(s.reasons&&s.reasons.length)) withReason++;
        if(s.res.charAt(0)==="C") courts++;
        if(s.res.charAt(0)==="L") longs++;
        if(s.res.charAt(1)==="G") gauche++;
        if(s.res.charAt(1)==="D") droite++;
      }
    });
  });
  /* jeu long : distance couverte = distance avant − distance après */
  var byClub={}, noClub=0;
  round.holes.forEach(function(h){
    h.shots.forEach(function(s,i){
      if(s.type!=="long") return;
      if(!s.club){ noClub++; return; }
      var o=byClub[s.club]||(byClub[s.club]={n:0,sum:0,k:0});
      o.n++;
      var nx=h.shots[i+1], cov=null;
      if(!nx) cov=s.dist;                              // coup rentré
      else if(nx.type==="long"||nx.type==="putt") cov=s.dist-nx.dist;
      if(cov!=null && cov>0){ o.sum+=cov; o.k++; }
    });
  });
  var clubRows=Object.keys(byClub).sort(function(a,b){ return ALLCLUBS.indexOf(a)-ALLCLUBS.indexOf(b); })
    .map(function(cl){ var o=byClub[cl];
      return '<tr><td>'+cl+'</td><td>'+o.n+'</td><td>'+(o.k?Math.round(o.sum/o.k)+" m":"—")+'</td></tr>'; }).join("");

  /* coups de départ */
  var T={n:0,fw:0,green:0,bk:0,eau:0,rg:0,rd:0,ag:0,ad:0,sans:0};
  round.holes.forEach(function(h,i){
    var s=h.shots[0];
    if(!s||s.type!=="long"||s.lie!=="Départ") return;
    if(!s.to){ T.sans++; return; }
    if(reportPar(i)>3){ T.n++; if(s.to==="Fairway") T.fw++; }
    if(s.to==="Green") T.green++;
    if(s.to==="Bunker") T.bk++;
    if(s.to==="Eau / HL") T.eau++;
    if(s.to==="Rough"){ if(s.side==="G") T.rg++; else if(s.side==="D") T.rd++; }
    if(s.to==="Arbres"){ if(s.side==="G") T.ag++; else if(s.side==="D") T.ad++; }
  });
  var gTot=T.rg+T.ag, dTot=T.rd+T.ad;
  var teeCard = (T.n||T.green||T.sans)
    ? '<div class="card"><p class="label">Coups de départ</p><table class="sum"><tbody>'+
      (T.n?'<tr><td>Fairways touchés (par 4 et 5)</td><td><b>'+T.fw+'/'+T.n+' — '+Math.round(T.fw/T.n*100)+' %</b></td></tr>':'')+
      (T.green?'<tr><td>Greens touchés (par 3)</td><td><b>'+T.green+'</b></td></tr>':'')+
      '<tr><td>Rough gauche / droite</td><td><b>'+T.rg+' / '+T.rd+'</b></td></tr>'+
      '<tr><td>Arbres gauche / droite</td><td><b>'+T.ag+' / '+T.ad+'</b></td></tr>'+
      '<tr><td>Bunkers</td><td><b>'+T.bk+'</b></td></tr>'+
      '<tr><td>Eau / hors limites</td><td><b>'+T.eau+'</b></td></tr>'+
      '<tr><td>Dispersion gauche / droite</td><td><b>'+gTot+' / '+dTot+'</b></td></tr>'+
      (T.sans?'<tr><td>Départs sans résultat</td><td><b>'+T.sans+'</b></td></tr>':'')+
      '</tbody></table></div>'
    : '';

  /* approches : greens en régulation et dispersion des ratés */
  var A={gir:0,girN:0,court:0,long:0,gauche:0,droite:0,n:0,lies:{}};
  round.holes.forEach(function(h,i){
    if(h.done&&holeComplete(h)){
      A.girN++; if(greenIn(h)<=reportPar(i)-2) A.gir++;
    }
    h.shots.forEach(function(s){
      if(s.type!=="long"||!s.land||s.land==="GREEN") return;
      A.n++;
      if(s.land.charAt(0)==="C") A.court++;
      if(s.land.charAt(0)==="L") A.long++;
      if(s.land.charAt(1)==="G"||s.land==="MG") A.gauche++;
      if(s.land.charAt(1)==="D"||s.land==="MD") A.droite++;
      if(s.to) A.lies[s.to]=(A.lies[s.to]||0)+1;
    });
  });
  var lieRows=Object.keys(A.lies).map(function(k){
    return '<tr><td>'+k+'</td><td><b>'+A.lies[k]+'</b></td></tr>'; }).join("");
  var apCard = (A.n||A.girN)
    ? '<div class="card"><p class="label">Approches et greens</p><table class="sum"><tbody>'+
      (A.girN?'<tr><td>Greens en régulation</td><td><b>'+A.gir+'/'+A.girN+' — '+Math.round(A.gir/A.girN*100)+' %</b></td></tr>':'')+
      '<tr><td>Ratés courts / longs</td><td><b>'+A.court+' / '+A.long+'</b></td></tr>'+
      '<tr><td>Ratés gauche / droite</td><td><b>'+A.gauche+' / '+A.droite+'</b></td></tr>'+
      lieRows+'</tbody></table>'+
      '<p class="muted" style="margin-top:10px">Un raté peut être court et à gauche : les deux axes se recoupent, comme au putting.</p></div>'
    : '';

  /* intention : un lay-up réussi se juge sur ce qu'il laisse, pas sur le SG */
  var byInt={};
  round.holes.forEach(function(h){
    h.shots.forEach(function(s,i){
      if(s.type!=="long"||!s.intent) return;
      var o=byInt[s.intent]||(byInt[s.intent]={n:0,rest:0,k:0,ok:0});
      o.n++;
      var nx=h.shots[i+1];
      if(nx&&(nx.type==="long"||nx.type==="putt")){ o.rest+=nx.dist; o.k++; }
      if(s.to==="Fairway"||s.to==="Green"||s.land==="GREEN") o.ok++;
    });
  });
  var intRows=INTENTS.filter(function(x){return byInt[x];}).map(function(x){
    var o=byInt[x];
    return '<tr><td>'+x+'</td><td>'+o.n+'</td><td>'+(o.k?Math.round(o.rest/o.k)+" m":"—")+
           '</td><td>'+o.ok+'/'+o.n+'</td></tr>'; }).join("");
  var intCard = intRows
    ? '<div class="card"><p class="label">Intention du coup</p>'+
      '<table class="sum"><thead><tr><th>Intention</th><th>Coups</th><th>Reste</th><th>Fairway/green</th></tr></thead>'+
      '<tbody>'+intRows+'</tbody></table>'+
      '<p class="muted" style="margin-top:10px">Un lay-up se juge sur la distance laissée et la position de balle, pas sur les coups gagnés : le barème suppose un joueur qui attaque.</p></div>'
    : '';

  /* ---- Tiger 5 (DECADE) : les cinq fautes qui font les gros scores ---- */
  var T5=[{k:"Double bogey ou pire",h:[]},
          {k:"Bogey ou pire sur un par 5",h:[]},
          {k:"Bogey ou pire après une occasion de toucher le green en régulation à 137 m ou moins",h:[]},
          {k:"3 putts ou plus",h:[]},
          {k:"Deux coups pour rejoindre le green",h:[]}];
  var t5N=0;
  round.holes.forEach(function(h,i){
    if(!h.done||!holeComplete(h)) return;
    t5N++;
    var p=reportPar(i), sc=nShots(h)-p, near=0, chips=0;
    h.shots.forEach(function(s,shotIndex){
      if(s.type!=="long") return;
      // Les pénalités occupent aussi un rang dans la séquence des coups.
      if(shotIndex+1<=p-2&&s.dist<=137&&s.dist>=30&&
         s.intent!=="Dégagement"&&s.intent!=="Lay-up") near++;
      if(s.dist<30) chips++;                 // abords du green
    });
    if(sc>=2) T5[0].h.push(h.n);
    if(p===5&&sc>=1) T5[1].h.push(h.n);
    if(sc>=1&&near>0) T5[2].h.push(h.n);
    if(nPutts(h)>=3) T5[3].h.push(h.n);
    if(chips>=2) T5[4].h.push(h.n);
  });
  var t5Tot=T5.reduce(function(a,b){return a+b.h.length;},0);
  var t5Card = t5N
    ? '<div class="card"><p class="label">Tiger 5 — fautes à éliminer</p>'+
      '<table class="sum"><thead><tr><th>Faute</th><th>Nb</th><th>Trous</th></tr></thead><tbody>'+
      T5.map(function(x){
        return '<tr'+(x.h.length?' style="color:var(--red);font-weight:700"':'')+'><td>'+x.k+'</td><td>'+
               x.h.length+'</td><td>'+(x.h.length?x.h.join(", "):"—")+'</td></tr>'; }).join("")+
      '<tr style="font-weight:800"><td>Total sur '+t5N+' trou'+(t5N>1?'x':'')+'</td><td>'+t5Tot+'</td><td></td></tr>'+
      '</tbody></table>'+
      '<p class="muted" style="margin-top:10px">Le critère de distance compte une attaque du green entre 30 et 137 m jouée alors que la régulation est encore possible. Les dégagements et lay-ups sont exclus. Un même trou peut cocher plusieurs lignes. « Deux coups pour rejoindre le green » est le two-chip : deux coups joués des abords du green.</p></div>'
    : '';

  var metrics=roundSG(round), SG=metrics.SG, putts2=metrics.putts, sgHoles=metrics.holes;
  var t2g=SG["Départ"].v+SG["Approches"].v+SG["Petit jeu"].v;
  var t2gN=SG["Départ"].n+SG["Approches"].n+SG["Petit jeu"].n;
  var sgTot=t2g+SG["Putting"].v+SG["Pénalités"].v;
  function sgRow(lab,o,strong){
    if(!o.n) return '<tr><td>'+lab+'</td><td>—</td><td>—</td></tr>';
    return '<tr'+(strong?' style="font-weight:800"':'')+'><td>'+lab+'</td><td>'+o.n+'</td><td>'+sgFmt(o.v)+'</td></tr>';
  }
  var sgCard = sgHoles
    ? '<div class="card"><p class="label">Coups gagnés — '+(usesBroadie()?sgBenchmarkLabel():"barème provisoire")+'</p>'+
      '<table class="sum"><thead><tr><th>Secteur</th><th>Coups</th><th>SG</th></tr></thead><tbody>'+
      sgRow("Départ (par 4 et 5)",SG["Départ"])+
      sgRow("Approches",SG["Approches"])+
      sgRow("Petit jeu (moins de 30 m)",SG["Petit jeu"])+
      '<tr style="font-weight:800"><td>Tee to green</td><td>'+t2gN+'</td><td>'+(t2gN?sgFmt(t2g):"—")+'</td></tr>'+
      sgRow("Putting",SG["Putting"])+
      (SG["Pénalités"].n?sgRow("Pénalités",SG["Pénalités"]):"")+
      '<tr style="font-weight:800"><td>Total</td><td>'+(t2gN+SG["Putting"].n)+'</td><td>'+sgFmt(sgTot)+'</td></tr>'+
      '</tbody></table>'+
      '<p class="muted" style="margin-top:10px">Calculé sur '+sgHoles+' trou'+(sgHoles>1?'x':'')+
      ' validé'+(sgHoles>1?'s':'')+' et terminé'+(sgHoles>1?'s':'')+'. Le départ des par 3 compte dans les approches. '+
      ''+(usesBroadie()?'Tables historiques de Broadie. Les distances hors table sont bornées.':'Barème Golf Performance provisoire.')+'</p></div>'
    : '';
  var puttAnalysis = putts2.length
    ? '<details class="putt-analysis"><summary>Analyser mes putts</summary>'+
      '<p class="muted">Trous terminés et validés · '+sgBenchmarkLabel()+'. Les groupes de cassure et de pente incluent les putts dont le contexte est renseigné.</p>'+
      puttingCharts(putts2,false)+'</details>'
    : '<p class="muted">L’analyse s’affiche après validation d’un trou terminé comportant des putts.</p>';

  /* scrambling : green manqué en régulation, et par quand même */
  var SC={n:0,ok:0,by:{}};
  round.holes.forEach(function(h,i){
    if(!h.done||!holeComplete(h)) return;
    var p=reportPar(i);
    if(greenIn(h)<=p-2) return;                 // green en régulation : pas une occasion
    SC.n++;
    var ok = nShots(h)<=p;
    if(ok) SC.ok++;
    var last=null,j;
    for(j=h.shots.length-1;j>=0;j--) if(h.shots[j].type==="long"){ last=h.shots[j]; break; }
    var from = last ? (last.lie==="Green"?"Avant-green":last.lie) : "Non renseigné";
    var o=SC.by[from]||(SC.by[from]={n:0,ok:0}); o.n++; if(ok) o.ok++;
    var shortSide=false;
    h.shots.forEach(function(s){ if(s.type==="long"&&s.short) shortSide=true; });
    var key=shortSide?"short":"wide";
    SC[key]=SC[key]||{n:0,ok:0}; SC[key].n++; if(ok) SC[key].ok++;
  });
  function sideRow(lab,o){
    if(!o||!o.n) return '';
    return '<tr><td>'+lab+'</td><td>'+o.ok+'/'+o.n+'</td><td>'+Math.round(o.ok/o.n*100)+' %</td></tr>';
  }
  var scRows=Object.keys(SC.by).map(function(k){
    var o=SC.by[k];
    return '<tr><td>'+k+'</td><td>'+o.ok+'/'+o.n+'</td><td>'+Math.round(o.ok/o.n*100)+' %</td></tr>'; }).join("");
  var scCard = SC.n
    ? '<div class="card"><p class="label">Scrambling</p><table class="sum"><tbody>'+
      '<tr style="font-weight:800"><td>Greens manqués sauvés</td><td>'+SC.ok+'/'+SC.n+'</td><td>'+
      Math.round(SC.ok/SC.n*100)+' %</td></tr></tbody></table>'+
      '<table class="sum" style="margin-top:12px"><thead><tr><th>Depuis</th><th>Sauvés</th><th>Taux</th></tr></thead>'+
      '<tbody>'+scRows+'</tbody></table>'+
      ((SC.short||SC.wide)
        ? '<table class="sum" style="margin-top:12px"><thead><tr><th>Côté</th><th>Sauvés</th><th>Taux</th></tr></thead><tbody>'+
          sideRow("Côté court",SC.short)+sideRow("Bon côté",SC.wide)+'</tbody></table>' : '')+
      '<p class="muted" style="margin-top:10px">Un sauvetage est un par ou mieux après un green manqué en régulation. « Depuis » est la position du dernier coup joué avant le green, donc le taux de sortie de bunker se lit directement.</p></div>'
    : (round.holes.filter(function(h,i){return h.done&&holeComplete(h);}).length
        ? '<div class="card"><p class="label">Scrambling</p><p class="muted">Aucun green manqué en régulation sur les trous validés.</p></div>' : '');

  /* lecture de green : répartition des erreurs, dont l'inversion de sens */
  var RD={}, rdN=0, inv=0;
  round.holes.forEach(function(h){
    h.shots.forEach(function(s){
      if(s.type!=="putt"||!s.read) return;
      rdN++; RD[s.read]=(RD[s.read]||0)+1;
      if(s.read==="Cassure inverse") inv++;
    });
  });
  var readCard = rdN
    ? '<div><p class="label">Lecture de green</p>'+
      '<table class="sum"><tbody>'+
      READS.map(function(k){ return '<tr'+(k==="Cassure inverse"&&RD[k]?' style="color:var(--red);font-weight:700"':'')+
        '><td>'+k+'</td><td><b>'+(RD[k]||0)+'</b></td></tr>'; }).join("")+
      '<tr style="font-weight:800"><td>Taux d’inversion de sens</td><td>'+inv+'/'+rdN+' — '+Math.round(inv/rdN*100)+' %</td></tr>'+
      '</tbody></table>'+
      '<p class="muted" style="margin-top:10px">Sur les putts manqués où tu as renseigné la lecture. L’inversion de sens est ton axe de travail : à croiser avec la taille de cassure ci-dessus.</p></div>'
    : '';

  var rate=missed?Math.round(withReason/missed*100):0;

      (t.v?'<p class="muted" style="margin:10px 0 0">Score calculé sur les '+t.v+' trous validés (par joué '+t.parPlayed+').</p>':'')+
    '</div>'+
    '<div class="card"><p class="label">Complétude</p>'+
      '<p style="margin:0 0 6px"><b>'+t.v+'</b> validés, <b>'+inc+'</b> à compléter, <b>'+emp+'</b> non saisis.</p>'+
      '<p class="muted">Seuls les trous validés comparent putting et jeu long sur le même tour.</p></div>'+

    '<div class="card"><p class="label">Putting</p><table class="sum"><tbody>'+

      '</tbody></table><p class="muted" style="margin-top:10px">Un raté peut être long et à gauche : les axes se recoupent.</p>'+puttAnalysis+readCard+'</div>'+

    '<div class="card"><p class="label">Jeu long par club</p>'+

    t5Card+
    '<div class="card"><p class="label">Par type de trou</p>'+
      '<table class="sum"><thead><tr><th>Type</th><th>Trous</th><th>vs par</th><th>Putts/trou</th></tr></thead>'+
      '<tbody>'+parRow(3)+parRow(4)+parRow(5)+'</tbody></table></div>'+

function paintShortGameEntry(){
  var session=S.shortGameDraft, id=session.id, drill=shortGameDrills[id];
  var n=session.results.length, done=n===drill.volume;
  var distance=id===0?drill.distances[n%3]:id===1?drill.distances[Math.floor(n/5)]:session.setup.distance;
  var lie=id===3?shortLies[Math.floor(n/3)]:id===2?"Bunker":session.setup.lie;
  var fields="";
  if(!done){
    fields=id<2?choicePutting("Retombée","shortLanding",shortLandings)+choicePutting("Direction de l’arrêt","shortStop",shortStops):
      id===2?choicePutting("Sortie au premier coup","shortExit",["Sortie","Encore dans le bunker"]):
      inputNumber("Distance du premier coup (m)","shortStart","",.1,100,.1)+
      inputNumber("Coups pour terminer (putts compris)","shortStrokes","",1,30,1)+
      inputNumber("Dont putts","shortPutts","",0,29,1);
    fields+=inputNumber(id===3?"Distance laissée après le premier coup (m)":"Distance finale au trou (m)","shortRest","",0,100,.01);
  }
  trainingView(drill.name,n+" / "+drill.volume+' essais',
    '<div class="card">'+(done?
      '<button class="btn primary" id="shortFinish">Enregistrer et voir le bilan</button>':
      '<p><b>'+lie+'</b>'+(distance?' · '+fmt(distance)+' m':' · Poste '+(n+1))+'</p>'+
      '<p class="muted">Saisis 0 m si la balle est rentrée.</p><form id="shortEntry" class="drill-form">'+fields+
      '<p id="shortError" role="alert"></p><button class="btn primary" type="submit">Enregistrer l’essai</button></form>')+
    (n?'<button class="btn ghost" id="shortUndo">Corriger le dernier essai</button>':'')+'</div>'+
    (!store.ok?'<p role="alert">Sauvegarde locale indisponible. Garde la page ouverte.</p>':''),
    "Retour au petit jeu",paintShortGame);
  if(n) $("shortUndo").onclick=function(){session.results.pop();save();paintShortGameEntry();};
  if(done){
    $("shortFinish").onclick=function(){
      var previous=S.shortGameSessions;
      session.finishedAt=new Date().toISOString();
      S.shortGameSessions=[session].concat(shortSessions());
      delete S.shortGameDraft;
      save();
      if(!store.ok){S.shortGameSessions=previous;S.shortGameDraft=session;paintShortGameEntry();return;}
      paintShortSummary(0,paintShortGame);
    };
    return;
  }
  $("shortEntry").onsubmit=function(event){
    event.preventDefault();
    function number(id){return Number($(id).value);}
    var rest=number("shortRest");
    var result={distance:distance,lie:lie,rest:rest};
    if(id<2){result.landing=$("shortLanding").value;result.stop=rest===0?"Rentré":$("shortStop").value;}
    if(id===2){
      result.exited=$("shortExit").value==="Sortie";
      if(rest===0&&!result.exited){$("shortError").textContent="Une balle rentrée compte comme une sortie.";return;}
    }
    if(id===3){
      result.distance=number("shortStart");result.strokes=number("shortStrokes");result.putts=number("shortPutts");
      if(result.putts>=result.strokes||(result.strokes===1)!==(rest===0)){
        $("shortError").textContent="Vérifie les coups, les putts et la distance laissée après le premier coup.";
        return;
      }
    }
    result.ok=id===3?result.strokes<=2:rest<=drill.radius&&(id!==2||result.exited);
    session.results.push(result);save();paintShortGameEntry();
  };
}
function shortResultLabel(session){
  var drill=shortGameDrills[session.id];
  return session.results.filter(function(result){return result.ok;}).length+'/'+session.results.length+
    (session.id===3?" en 2 coups ou moins":" à "+drill.radius+" m ou moins");
}
function shortComparable(a,b){
  if(a.id!==b.id||JSON.stringify(a.setup)!==JSON.stringify(b.setup)) return false;
  return a.id!==3||a.results.every(function(result,i){
    return b.results[i]&&result.distance===b.results[i].distance;
  });
}
function paintShortSummary(index,back){
  var session=shortSessions()[index], drill=shortGameDrills[session.id];
  var previous=shortSessions().slice(index+1).find(function(old){return shortComparable(session,old);});
  var keys=session.id===3?shortLies:Array.from(new Set(session.results.map(function(r){return r.distance;})));
  var content='<div class="card"><h2>'+shortResultLabel(session)+'</h2>'+
    (previous?'<p>Dernier test comparable · '+shortResultLabel(previous)+'</p>':'')+'</div>'+
    '<div class="card"><p class="label">Détail par '+(session.id===3?"lie":"distance")+'</p>'+
    keys.map(function(key){
      var rows=session.results.filter(function(r){return (session.id===3?r.lie:r.distance)===key;});
      var leaves=rows.reduce(function(sum,r){return sum+r.rest;},0)/rows.length;
      var extra="";
      if(session.id<2){
        var observed=rows.filter(function(r){return r.landing!=="Non observée";});
        extra='<p>Retombée dans la zone : '+observed.filter(function(r){return r.landing==="Dans la zone";}).length+'/'+observed.length+
          ' observées</p><p>'+rows.filter(function(r){return r.stop==="Court";}).length+' courts · '+
          rows.filter(function(r){return r.stop==="Long";}).length+' longs</p>';
      }else if(session.id===2){
        extra='<p>Sorties au premier coup : '+rows.filter(function(r){return r.exited;}).length+'/'+rows.length+'</p>';
      }else{
        extra='<p>'+rows.reduce(function(sum,r){return sum+r.putts;},0)+' putts sur '+rows.length+' situations</p>';
      }
      return '<details class="putt-group"><summary><b>'+key+(session.id===3?"":" m")+'</b> · '+
        rows.filter(function(r){return r.ok;}).length+'/'+rows.length+'</summary><p>Distance laissée moyenne : '+fmt(leaves)+' m</p>'+
        extra+'<ol>'+rows.map(function(r){
          return '<li>'+(session.id===3?fmt(r.distance)+' m au départ · '+r.strokes+' coups · '+r.putts+' putts · ':"")+
            (session.id<2?r.landing+' · '+r.stop+' · ':"")+fmt(r.rest)+' m restants'+
            (session.id===2?(r.exited?" · Sortie":" · Encore dans le bunker"):"")+'</li>';
        }).join("")+'</ol></details>';
    }).join("")+'</div>';
  trainingView(drill.name,"Bilan · "+displayRoundDate(session.date),content,"Retour",back);
}
function shortGameStats(from,to){

function longResult(session){
  return session.results.filter(function(r){return r.ok;}).length+"/"+session.results.length+

function longGameSummary(index,back){
  var session=longSessions()[index],id=session.id,rows=session.results;
  var previous=longSessions().slice(index+1).find(function(other){
    return other.id===id&&JSON.stringify(other.setup)===JSON.stringify(session.setup);
  });
  function count(test){return rows.filter(test).length;}
  var extra=id===3?'<p>Hauteur réussie : '+count(function(r,i){return r.height===flightHeights[Math.floor(i/3)];})+
    '/9 · Effet réussi : '+count(function(r,i){return r.shape===flightShapes[i%3];})+'/9</p>'+
    '<table class="sum"><thead><tr><th>Hauteur</th>'+flightShapes.map(function(shape){return '<th>'+shape+'</th>';}).join("")+
    '</tr></thead><tbody>'+flightHeights.map(function(height,i){
      return '<tr><th>'+height+'</th>'+rows.slice(i*3,i*3+3).map(function(r){
        return '<td class="'+(r.ok?'history-score-even':'history-score-under')+'">'+(r.ok?'Réussi':'Manqué')+'</td>';
      }).join("")+'</tr>';
    }).join("")+'</tbody></table>':
    '<p>Gauche '+count(function(r){return r.side==="Gauche";})+' · Droite '+count(function(r){return r.side==="Droite";})+'</p>';
  if(id===1||id===2){
    var mean=rows.reduce(function(sum,r){return sum+Math.abs(r.error);},0)/rows.length;
    var tolerance=session.setup.tolerance;
    extra+='<p>Court '+count(function(r){return r.error < -tolerance;})+' · Long '+
      count(function(r){return r.error > tolerance;})+' · Écart absolu moyen '+fmt(mean)+' m</p>';
  }
  trainingView(longDrills[id].name,"Bilan · "+displayRoundDate(session.date),'<div class="card"><h2>'+longResult(session)+'</h2>'+
    (previous?'<p>Dernier test comparable · '+longResult(previous)+'</p>':'')+extra+
    '<details><summary>Voir les balles</summary><ol>'+rows.map(function(r,i){
      return '<li>'+(id===3?flightHeights[Math.floor(i/3)]+' · '+flightShapes[i%3]+' → '+r.height+' · '+r.shape:
        r.side+(id===0?"":" · "+fmt(r.carry)+" m"))+'</li>';
    }).join("")+'</ol></details></div>',"Retour",back);
}

}

      for(var i=0;i<=mode;i++){ distances.push(d*0.3048); zones.push(d*0.3048*[.20,.15,.10,.075,.05][level]); }
    });
  }else{
    for(var d=3;d<=15;d++){
      var order=mode===0?[1,2,3]:[[2,1,3],[3,2,1],[1,3,2]][d%3];
      order.forEach(function(zone){distances.push(d*.3048);zones.push(zone*.3048);});
    }
  }
  return {distances:distances,zones:zones};
}

function startPuttingDrill(id,challenge){

    var plan=challengePlan(id,setup.level,setup.mode);
    setup.volume=plan.distances.length;

    var unlocked=setup.mode===0||puttingLog().some(function(session){
      return session.id===id&&session.setup.level===setup.level&&session.setup.mode===setup.mode-1&&
        session.results.length===session.setup.volume&&session.results.every(function(r){return r.ok;});
    });

      sheet('<h3>Palier verrouillé</h3><p>Valide d’abord le mode précédent à cette difficulté.</p>'+

      return;
    }

    setup.volume=[0,8].includes(id)?18:id===10?20:+$("drillVolume").value;
    if(id===9||["gate","read","chart","aim"].includes(kind)) setup.distance=+$("drillDistance").value;
    if(id===13) setup.gate=$("drillGate").value;

function plannedPuttingDistance(draft,i){
  if(draft.setup.distances) return Math.round(draft.setup.distances[i]*100)/100;
  if(draft.id===10) return [1.524,3.048,4.572,6.096][i%4];
  if(draft.id===0||draft.id===8) return i+1;
  if(draft.setup.distance) return draft.setup.distance;
  if(draft.id===11||draft.id===20) return [3,5,8,12][i%4];
  var range=performanceRanges[draft.id];
  return range?Math.round((range[0]+(range[1]-range[0])*((i*7)%11)/10)*10)/10:3;
}
function puttingSpeedWindow(distance,slope){
  var i=distance<4?0:distance<7?1:distance<11?2:3;
  var zones=[[[.2,.6],[.2,.5],[.3,.8]],[[-.2,.5],[0,.5],[0,.6]],
    [[-.3,.5],[-.2,.6],[-.2,.8]],[[-.5,.9],[-.6,.8],[-.5,.9]]];
  return zones[i][Math.max(0,["Plat","Montée","Descente"].indexOf(slope))];
}

      (quick.length?quick.map(function(label,j){return '<button type="button" class="btn" id="puttingQuick'+j+'">'+label+'</button>';}).join(""):

  if(i) $("puttingUndo").onclick=function(){draft.results.pop();save();paintPuttingEntry();};

      }

    }
    updateResult();
  }
  function record(result){draft.results.push(result);save();paintPuttingEntry();}
  quick.forEach(function(label,j){
    $("puttingQuick"+j).onclick=function(){record({label:label,ok:j===1,d:next});};
  });
  $("puttingEntry").onsubmit=function(event){
    event.preventDefault();
    if(quick.length) return;

      result={d:num("pDistance"),res:holed?"IN":DIRS.find(function(d){return d[1]===val("pResult");})[0],
        rest:holed?0:num("pRest"),brk:BREAKS.includes(val("pBreak"))?val("pBreak"):null,
        amt:AMOUNTS.includes(val("pAmount"))?val("pAmount"):null,slope:SLOPES.includes(val("pSlope"))?val("pSlope"):null,
        read:!holed&&READS.includes(val("pRead"))?val("pRead"):null,

      result.ok=result.error<=(kind==="slope"?.30000001:2.5);
      result.inverse=result.guess*result.actual<0;
    }
    if(kind==="read"){
      result.label=val("pRead");result.gate=val("pGate");result.ok=result.label==="Bonne";
    }
    if(kind==="speed"){
      result.d=num("pDistance");result.slope=val("pSlope");result.rest=num("pRest");
      var zone=puttingSpeedWindow(result.d,result.slope);
      if(val("pResult")==="Rentré"){result.label="Rentré";result.rest=0;}

    }
    if(kind==="aim"){
      result.rest=num("pRest");result.error=Math.abs(Math.atan(result.rest/100/result.d)*180/Math.PI);
      result.ok=result.error<.7;
    }
    record(result);
  };
}

/* ===================== SAUVEGARDE ET EXPORT =====================
   Tout vit dans le navigateur : ces fonctions sont la seule porte de sortie. */
function allRounds(){
  var list=[]; if(S.round) list.push(S.round);
  (S.archive||[]).forEach(function(r){ list.push(r); });
  return list;
}
function courseOf(r){
  for(var i=0;i<(S.courses||[]).length;i++) if(S.courses[i].id===r.courseId) return S.courses[i];
  return null;
}
function sgOfShot(h,i){
  var s=h.shots[i];
  if(s.type==="penalty") return -1;
  var e0=(s.type==="putt")?ePutt(s.dist):eLong(s.dist,s.lie);
  var j=i+1; while(h.shots[j]&&h.shots[j].type==="penalty") j++;
  var nx=h.shots[j];
  var e1=nx?((nx.type==="putt")?ePutt(nx.dist):eLong(nx.dist,nx.lie)):0;
  return e0-e1-1;
}
function sectorOf(s,p){
  if(s.type==="penalty") return "Pénalité";
  if(s.type==="putt") return "Putting";
  if(s.lie==="Départ"&&p>3) return "Départ";
  return s.dist<30?"Petit jeu":"Approches";
}
function csvCell(v){
  if(v===null||v===undefined) return "";
  var t=String(v);
  if(typeof v==="number") t=t.replace(".",",");
  return /[;"\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
}
function exportCSV(){
  var head=["Date","TypeTour","Parcours","Depart","Trou","Par","LongueurTrou","NoCoup","TypeCoup",
    "Club","Lie","DistanceAvant","Intention","Arrivee","Cote","Drapeau","CoteCourt","DistanceRestante",
    "CassureSens","CassureTaille","Pente","Lecture","Execution","Secteur","SG","TrouValide"];
  var rows=[head.join(";")];
  allRounds().forEach(function(r){
    var co=courseOf(r), pars=co?co.pars:null, tn=co?co.name:"";
    var tee=null,k; if(co) for(k=0;k<co.tees.length;k++) if(co.tees[k].name===r.tee) tee=co.tees[k];
    r.holes.forEach(function(h,hi){
      var p=pars?pars[hi]:"", L=tee?tee.dist[hi]:"";
      var ok=h.done&&holeComplete(h);
      h.shots.forEach(function(s,i){
        var arrivee = s.type==="putt"
          ? (s.res==="IN"?"Rentré":landLab(s.res))
          : (s.land?landLab(s.land):(s.to||""));
        rows.push([r.date,r.type||"",tn,r.tee,h.n,p,L,i+1,
          s.type==="putt"?"Putt":(s.type==="penalty"?"Pénalité":"Long"),
          s.club||"",s.lie||"",s.dist===undefined?"":s.dist,s.intent||"",
          arrivee,s.side==="G"?"Gauche":(s.side==="D"?"Droite":""),s.pin||"",s.short?"oui":"",
          s.rest===undefined?"":s.rest,s.brk||"",s.amt||"",s.slope||"",s.read||"",
          (s.exec||[]).join(" + "),sectorOf(s,p),
          ok?Math.round(sgOfShot(h,i)*1000)/1000:"", ok?"oui":"non"
        ].map(csvCell).join(";"));
      });
    });
  });
  return rows.join("\n");
}
function downloadText(name,text,mime){
  try{
    var blob=new Blob(["\ufeff"+text],{type:mime+";charset=utf-8"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },800);
    return true;
  }catch(e){ return false; }
}

          $("roundDateError").textContent="Enregistrement indisponible. Réessaie sans fermer la page.";
          return;
        }
        suspendedShot=null; draft=null; formOpen=false;
        closeSheet(); paintCarte();
      };
    });
}
$("btnReset").onclick=chooseRoundDate;

S=load();

if(!S||!S.courses||!S.round||!S.round.holes||S.round.holes.length!==18) S=freshState();
if(!S.bag || !S.bag.length) S.bag=DEFBAG.slice();
if(!S.bagPutter){ if(S.bag.indexOf("Pu")<0) S.bag.push("Pu"); S.bagPutter=true; }  // une seule fois : retirable dans Profil
if(!S.prefTee){                      // préférence par défaut : boules blanches
  S.prefTee="Blanc";
  var _c=course();
  if(_c && _c.tees.filter(function(t){return t.name==="Blanc";}).length) S.round.tee="Blanc";
}
save();
paintHome();
})();
</script>
