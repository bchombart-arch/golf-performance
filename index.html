<title>Golf Performance — Saisie du tour</title>
<style>
  :root{
    --fs: 20px;
    --ink:#101418; --ink2:#55606b; --line:#dfe4ea; --bg:#edf5ef; --card:#fff;
    --ok:#15803d; --okbg:#e7f5ec; --todo:#b45309; --todobg:#fdf2e3; --none:#8b949e;
    --blue:#15506b; --red:#b91c1c;
    --tap:72px;
  }
  html.xl{ --fs:25px; --tap:84px; }
  html.xl .btn{font-size:.92em}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  /* l'écran ne se déplace que verticalement : ni pincement, ni glissement latéral, ni rebond */
  html,body{
    margin:0;padding:0;width:100%;max-width:100%;
    overflow-x:hidden;                 /* rien ne dépasse sur le côté */
    overscroll-behavior:none;          /* pas de rebond, pas de retour arrière au bord */
    touch-action:pan-y;                /* un doigt fait défiler vers le haut ou le bas, c'est tout */
  }
  body{overflow-wrap:anywhere}         /* un mot trop long se coupe au lieu d'élargir la page */
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:var(--fs); line-height:1.3; color:var(--ink); background:var(--bg);
    -webkit-text-size-adjust:100%;
  }
  /* coquille d'application : plein écran sur téléphone, châssis centré sur grand écran */
  .app{
    position:relative; width:100%; max-width:430px; margin:0 auto; background:var(--bg);
    height:100vh; height:100dvh; overflow:hidden; overflow-x:hidden; display:flex; flex-direction:column;
    touch-action:pan-y;
    padding-top:env(safe-area-inset-top);
  }
  .scroll{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
          overscroll-behavior-y:contain; overscroll-behavior-x:none; touch-action:pan-y}
  .wrap{max-width:none;margin:0;padding:0 12px 24px}
  @media (min-width:760px) and (min-height:720px){
    body{background:#20262c; display:flex; align-items:center; justify-content:center; min-height:100vh}
    .app{height:min(880px,92vh); border-radius:44px; border:12px solid #0b0e11;
         box-shadow:0 30px 70px rgba(0,0,0,.45); overflow:hidden}
  }
  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:10px 12px 8px;margin:0 -12px 10px;border-bottom:2px solid var(--line);
  }
  .hrow{display:flex;align-items:center;gap:10px}
  .htitle{font-size:min(1.5em,6.6vw);font-weight:800;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* jamais deux lignes */
  .hrow>div:first-child{min-width:0}
  .hsub{color:var(--ink2);font-size:.8em;font-weight:600;margin-top:2px}
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:var(--tap);width:100%;border:2px solid var(--line);background:var(--card);
    border-radius:14px;font-weight:700;font-size:1.05em;padding:10px 12px;
    text-align:center;line-height:1.15;overflow-wrap:anywhere;
  }
  .btn:active{transform:scale(.985)}
  .btn.sel{border-color:var(--blue);background:var(--blue);color:#fff}
  .btn.primary{background:var(--ok);border-color:var(--ok);color:#fff;font-size:1.25em}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--blue);font-weight:700;min-height:56px}
  .btn.small{min-height:56px;font-size:.95em;border-radius:12px}
  /* rangée unique qui défile de droite à gauche : le seul endroit où le doigt va de côté */
  .rowscroll{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overflow-y:hidden;
    touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding:2px 0 6px;margin-bottom:14px;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 94%,transparent 100%);
            mask-image:linear-gradient(90deg,#000 0,#000 94%,transparent 100%)}
  .rowscroll::-webkit-scrollbar{display:none}
  /* molette : une règle graduée qui défile sous le pouce, le trait central marque la valeur */
  .wheel{position:relative;margin:2px 0 12px;border:2px solid var(--line);border-radius:14px;
    background:var(--card);padding:6px 0 4px;overflow:hidden}
  .wheel .track{display:flex;flex-wrap:nowrap;gap:0;overflow-x:auto;touch-action:pan-x;
    overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;
    padding:0 50%;-webkit-overflow-scrolling:touch}
  .wheel .track::-webkit-scrollbar{display:none}
  .wheel .track button{flex:0 0 auto;scroll-snap-align:center;width:46px;min-height:52px;
    border:0;background:transparent;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;gap:4px;color:var(--ink2);font-size:.62em;font-weight:700;padding:0}
  .wheel .track button span{height:1.2em;line-height:1.2em}
  .wheel .track button i{display:block;width:2px;height:12px;background:var(--line);border-radius:2px}
  .wheel .track button.big i{height:20px;background:var(--ink2);opacity:.55}
  .wheel .track button.sel{color:var(--ok);font-size:.78em}
  .wheel .track button.sel i{background:var(--ok);height:24px;width:3px;opacity:1}
  .wheel .mark{position:absolute;left:50%;bottom:4px;height:30px;width:2px;margin-left:-1px;
    background:var(--ok);opacity:.3;pointer-events:none;border-radius:2px}
  .rowscroll>*{flex:0 0 auto;width:auto;min-width:0;white-space:nowrap;
    min-height:48px;padding:0 13px;font-size:.72em;border-radius:12px}
  html.xl .rowscroll>*{min-height:54px;font-size:.64em}
  .btn.danger{color:var(--red);border-color:#f3c9c9}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  /* trois colonnes : le libellé doit tenir sur une ligne, même en A+ */
  .g3 .btn,.g2 .btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;
    line-height:calc(var(--tap) - 20px);padding:10px 6px;text-align:center}
  .g3 .btn{font-size:min(.95em,4.4vw)}
  .g2 .btn{font-size:min(.95em,4.1vw)}
  .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .label{font-size:.78em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
  /* bandeau parcours */
  .course{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:12px}
  .course .t{flex:1;min-width:0}
  .course .t b{display:block;font-size:1.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .course .t span{font-size:.78em;color:var(--ink2);font-weight:600}
  .tee{width:26px;height:26px;border-radius:9px;border:2px solid #0003;flex:none}
  /* carte des trous */
  .holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .hole{
    border:2px solid var(--line);background:var(--card);border-radius:16px;
    min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px;
  }
  .hole .n{font-size:1.6em;font-weight:800;line-height:1}
  .hole .ref{font-size:.74em;font-weight:700;color:var(--ink2)}
  .hole .m{font-size:.86em;font-weight:800}
  .hole .s{font-size:.7em;font-weight:800;letter-spacing:.03em}
  .hole.done{border-color:var(--ok);background:var(--okbg)} .hole.done .s{color:var(--ok)}
  .hole.todo{border-color:var(--todo);background:var(--todobg)} .hole.todo .s{color:var(--todo)}
  .hole.empty .s{color:var(--none)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8em;font-weight:700;color:var(--ink2);margin-top:10px}
  .dot{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:5px;border:2px solid}
  .d-done{background:var(--okbg);border-color:var(--ok)}
  .d-todo{background:var(--todobg);border-color:var(--todo)}
  .d-none{background:#fff;border-color:var(--line)}
  .tot{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;text-align:center}
  .tot div b{display:block;font-size:1.7em;font-weight:800;line-height:1.1}
  .tot div span{font-size:.7em;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
  /* liste des coups */
  .shot{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;min-height:64px;margin-bottom:8px;
  }
  .shot .idx{width:38px;height:38px;flex:none;border-radius:11px;background:#eef1f4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95em}
  .shot.putt .idx{background:#e7eef3;color:var(--blue)}
  .shot.pen .idx{background:#fae6e6;color:var(--red)}
  .shot .t{flex:1;min-width:0}
  .shot .t b{display:block;font-size:1.05em}
  .shot .t span{display:block;font-size:.78em;color:var(--ink2);font-weight:600}
  .shot .chev{color:var(--ink2);font-weight:800}
  /* saisie */
  .big{font-size:2.6em;font-weight:800;text-align:center;line-height:1;margin:4px 0 2px}
  .bigin{width:100%;min-height:var(--tap);border:2px solid var(--line);border-radius:14px;background:var(--card);
    font-size:2.2em;font-weight:800;text-align:center;padding:0 6px;-moz-appearance:textfield}
  .bigin:focus{border-color:var(--blue);outline:none}
  .bigin::-webkit-outer-spin-button,.bigin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .bigu{text-align:center;font-size:.6em;font-weight:700;color:var(--ink2);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html.xl .bigu{font-size:.52em}
  .stepper{display:grid;grid-template-columns:var(--tap) 1fr var(--tap);gap:10px;align-items:center;margin-bottom:10px}
  .stepper button{min-height:var(--tap);border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:1.8em;font-weight:800}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;min-height:56px;font-weight:700;font-size:1em;flex:1 0 auto}
  .chip.sel{border-color:var(--blue);background:var(--blue);color:#fff}
  /* rangée tenue sur une seule ligne : le texte passe à la ligne dans le bouton */
  .chips.one{flex-wrap:nowrap}
  .chips.one .chip{flex:1 1 0;min-width:0;padding:0 6px;white-space:normal;line-height:1.1;font-size:.92em;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .pad .m{min-height:var(--tap);border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:.92em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
  /* classe propre au pavé : « in » entrait en conflit avec le panneau .sheet .in */
  .pad .gr{grid-column:2;background:var(--ok);border-color:var(--ok);color:#fff;font-size:1.1em;
    min-height:var(--tap);border-radius:16px;border-width:2px;border-style:solid;
    width:auto;max-width:none;max-height:none;padding:6px;margin:0;overflow:visible;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
  .opt{border-top:2px dashed var(--line);margin-top:14px;padding-top:12px}
  /* éditeur de parcours */
  .ed{width:100%;border-collapse:collapse}
  .ed th{font-size:.72em;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);padding:4px}
  .ed td{padding:4px 2px;border-bottom:1px solid var(--line)}
  .ed td.h{font-weight:800;width:38px;text-align:center}
  .ed .pr{display:flex;gap:4px}
  .ed .pr button{flex:1;min-height:46px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-weight:800;font-size:.9em}
  .ed .pr button.sel{border-color:var(--blue);background:var(--blue);color:#fff}
  .ed input{width:100%;min-height:46px;border:2px solid var(--line);border-radius:10px;padding:0 8px;text-align:right;font-weight:700;background:var(--card)}
  textarea{width:100%;min-height:92px;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:.92em}
  input.txt{width:100%;min-height:var(--tap);border:2px solid var(--line);border-radius:14px;padding:0 12px;font-weight:700;background:var(--card)}
  /* barre basse */
  .bar{position:relative;flex-shrink:0;z-index:30;background:var(--card);border-top:2px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .bar .inner{margin:0 auto;display:grid;gap:10px}
  /* toast */
  .toast{
    position:absolute;left:12px;right:12px;bottom:calc(154px + env(safe-area-inset-bottom));z-index:40;
    background:var(--ok);color:#fff;border-radius:16px;padding:14px 16px;font-weight:800;
    display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(0,0,0,.18);
    max-width:700px;margin:0 auto;opacity:0;transform:translateY(12px);pointer-events:none;transition:.18s;
  }
  .toast.on{opacity:1;transform:none;pointer-events:auto}
  .toast .u{margin-left:auto;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:12px;min-height:48px;padding:0 14px;font-weight:800}
  .sheet{position:absolute;inset:0;z-index:50;background:rgba(16,20,24,.45);display:none;align-items:flex-end}
  .sheet.on{display:flex}
  .sheet .in{background:var(--card);width:100%;max-width:720px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px;max-height:86vh;overflow:auto}
  .sheet h3{margin:0 0 4px;font-size:1.2em}
  .warn{background:var(--todobg);border:2px solid var(--todo);border-radius:14px;padding:12px;font-weight:700;font-size:.9em;margin-bottom:12px}
  table.sum{width:100%;border-collapse:collapse;font-size:.86em}
  table.sum th,table.sum td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
  table.sum th:first-child,table.sum td:first-child{text-align:left}
  table.sum th{font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
  .muted{color:var(--ink2);font-size:.85em;font-weight:600}
  .hidden{display:none !important}

  .putt-analysis{margin-top:14px}
  .putt-analysis summary,.putt-group summary{cursor:pointer;padding:12px 8px}
  .putt-analysis>summary{font-weight:800;border:1px solid currentColor;border-radius:10px}
  .putt-group{border-bottom:1px solid var(--line)}
  .putt-track{display:block;position:relative;height:8px;margin-top:7px;background:rgba(127,127,127,.14);border-radius:4px}
  .putt-track::after{content:"";position:absolute;left:50%;height:100%;border-left:1px solid currentColor}
  .putt-track span{position:absolute;height:100%;border-radius:4px}
  .putt-detail{padding:0 8px 10px;overflow-wrap:anywhere}

  .main-nav{position:relative;z-index:55;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:3px 4px max(5px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
  .main-nav button{line-height:1.15;font-family:inherit;font-size:12px;font-weight:700;min-height:54px;padding:5px 2px;border:0;border-radius:10px;background:transparent;color:var(--ink2);cursor:pointer}
  .main-nav button[aria-current="page"]{background:var(--bg);color:var(--ink);box-shadow:inset 0 -3px var(--ok)}
  .main-nav button:focus-visible{outline:2px solid var(--ok);outline-offset:-3px}
  .main-nav .nav-icon{display:block;width:23px;height:23px;margin:0 auto 4px}
  html.xl .main-nav button{font-size:14px}
  .bar{padding-bottom:8px}
  .sheet{bottom:calc(63px + env(safe-area-inset-bottom))}

  header{padding:11px 14px 13px;margin-bottom:10px;color:#fff;border:0;
    background:radial-gradient(ellipse at 100% 0%,#22894c 0%,transparent 65%),linear-gradient(125deg,#10472b,#126537)}
  .htitle{line-height:1.1}
  .hsub{color:#e0f4e5;margin-top:3px}
  .hsub:empty{display:none}   /* pas de ligne vide quand il n'y a rien à dire */
  #btnXl{background:#fff;color:#124d2c;border-color:#d8efde;
    min-height:44px;font-size:.85em;border-radius:11px;flex:0 0 auto}
  #vHome .card{border:1px solid #cfe2d4;border-radius:18px;padding:16px;
    box-shadow:0 3px 9px rgba(18,71,43,.06)}
  #vHome .label{color:#185535}
  #vHome .home-finished{background:linear-gradient(135deg,#ddf1e3,#f5fbf6);border-color:#afd5b9}
  #vHome .home-active{border-left:4px solid var(--ok)}
  #vHome .home-score{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:4px 0 14px}
  #vHome .home-score strong{font-size:2em;line-height:1;color:#124d2c;font-variant-numeric:tabular-nums}
  #vHome .home-score span{color:#315741}
  #vHome .muted{margin-bottom:0}
  .btn.history-round{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;
    gap:12px;margin-top:8px;text-align:left;font-variant-numeric:tabular-nums}
  .history-round-meta{display:grid;min-width:0;overflow-wrap:anywhere}
  .history-round-meta>span{font-size:.75em;color:var(--ink2)}
  .history-score-under{color:var(--red)}
  .history-score-even{color:var(--ok)}
  .history-score-other{color:var(--ink)}
  .putt-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
  .putt-kpis>div{border-radius:12px;background:var(--okbg);padding:10px;overflow-wrap:anywhere}
  .putt-kpis b{display:block;font-size:1.05em;font-variant-numeric:tabular-nums}
  .putt-column-grid{display:grid;gap:3px;align-items:start;margin:8px 0}
  .putt-column{min-width:0;min-height:142px;padding:3px 1px;border:1px solid transparent;border-radius:8px;

<script>
(function(){
"use strict";
var KEY="gp_v2";
var LIES=["Départ","Fairway","Rough","Bunker","Arbres","Green"];

var INTENTS=["Attaque","Lay-up","Dégagement"];

/* ================= BARÈME PROVISOIRE DE COUPS ATTENDUS =================
   Ordres de grandeur du niveau PGA Tour, en mètres. Ces valeurs servent à
   faire tourner le calcul ; elles sont à remplacer par la table validée
   (document 02 : « la table de référence PGA Tour reste à établir »).
   Tout le calcul de SG ne lit que ce bloc.                              */
var BASE={
  putt:[[0.3,1.00],[0.5,1.02],[1,1.08],[1.5,1.24],[2,1.40],[2.5,1.51],[3,1.60],[4,1.72],

  /* départ : indexé sur la longueur du trou, pas sur une distance de jeu */
  Tee:[[110,2.80],[130,2.90],[150,3.00],[170,3.06],[190,3.14],[210,3.24],[240,3.46],[270,3.68],

};
function interp(tab,x){
  if(x<=tab[0][0]) return tab[0][1];
  if(x>=tab[tab.length-1][0]) return tab[tab.length-1][1];
  for(var i=1;i<tab.length;i++) if(x<=tab[i][0]){
    var a=tab[i-1], b=tab[i];
    return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);

  return tab[tab.length-1][1];
}
/* Broadie, Appendix B (yards) and Putts Gained (feet). */
var broadieRows=[
 [10,null,2.18,2.34,2.43,3.45],[20,null,2.40,2.59,2.53,3.51],[30,null,2.52,2.70,2.66,3.57],

 [160,2.99,2.98,3.23,3.28,3.81],[180,3.05,3.08,3.31,3.40,3.82],[200,3.12,3.19,3.42,3.55,3.87],
 [220,3.17,3.32,3.53,3.70,3.92],[240,3.25,3.45,3.64,3.84,3.97],[260,3.45,3.58,3.74,3.93,4.03],
 [280,3.65,3.69,3.83,4.00,4.10],[300,3.71,3.78,3.90,4.04,4.20],[320,3.79,3.84,3.95,4.12,4.31],
 [340,3.86,3.88,4.02,4.26,4.44],[360,3.92,3.95,4.11,4.41,4.56],[380,3.96,4.03,4.21,4.55,4.66],
 [400,3.99,4.11,4.30,4.69,4.75],[420,4.02,4.19,4.40,4.83,4.84],[440,4.08,4.27,4.49,4.97,4.94],
 [460,4.17,4.34,4.58,5.11,5.03],[480,4.28,4.42,4.68,5.25,5.13],[500,4.41,4.50,4.77,5.40,5.22],
 [520,4.54,4.58,4.87,5.54,5.32],[540,4.65,4.66,4.96,5.68,5.41],[560,4.74,4.74,5.06,5.82,5.51],
 [580,4.79,4.82,5.15,5.96,5.60],[600,4.82,4.89,5.25,6.10,5.70]
];
var broadie={
  putt:[[0,1],[2,1.01],[3,1.05],[4,1.14],[5,1.24],[6,1.34],[7,1.43],[8,1.50],[9,1.56],[10,1.61],
    [15,1.78],[20,1.87],[30,1.98],[40,2.06],[50,2.14],[60,2.21],[90,2.36]]
};
["Départ","Fairway","Rough","Bunker","Arbres"].forEach(function(lie,i){
  broadie[lie]=broadieRows.filter(function(row){return row[i+1]!==null;})

});
function usesBroadie(){return S.sgBenchmark==="broadie";}
function sgBenchmarkLabel(){return usesBroadie()?"PGA Tour · Broadie":"Golf Performance · barème provisoire";}
function ePutt(d){return usesBroadie()?interp(broadie.putt,d/.3048):interp(BASE.putt,d);}
function eLong(d,lie){
  if(usesBroadie()){
    if(lie==="Green") return ePutt(d);
    var yards=d/.9144;
    var table=lie==="Départ"&&yards<100?broadie.Fairway:broadie[lie]||broadie.Fairway;
    return interp(table,yards);
  }
  return interp(lie==="Départ"?BASE.Tee:BASE[lie]||BASE.Fairway,d);
}

  return ePutt(putt.d)-1-(putt.res==="IN"?0:ePutt(putt.rest));
}

/* ---- bibliothèque de parcours (données à vérifier sur la carte du club) ---- */

 "Blanc":[467,170,289,459,383,120,381,378,442,476,191,346,326,152,454,165,335,390],

 "Violet":[380,110,222,310,260,80,270,260,362,380,121,215,240,100,310,80,226,280],

var HAW_PAR=[5,4,3,5,4,3,4,4,5,3,4,5,4,3,4,4,4,5];

var S=null, cur=0, draft=null, lastUndo=null, toastT=null, store={ok:true}, formOpen=false;

/* ---------- stockage ---------- */
function load(){ try{var r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){store.ok=false;} return null; }

  var el=$("storeState"); if(!el) return;
  el.textContent = store.ok ? "Sauvegarde sur le téléphone après chaque coup · reprise automatique"
                            : "Sauvegarde locale indisponible — ne ferme pas la page";

}
function localRoundDate(date){
  var now=date||new Date();
  return [now.getFullYear(),String(now.getMonth()+1).padStart(2,"0"),
    String(now.getDate()).padStart(2,"0")].join("-");
}
function displayRoundDate(date){return date?date.split("-").reverse().join("/"):"";}
function newRound(courseId, teeName, date){
  var h=[],i; for(i=1;i<=18;i++) h.push({n:i,shots:[],done:false});
  return {courseId:courseId, tee:teeName, type:(S&&S.round&&S.round.type)||"Partie amicale",
          date:date||localRoundDate(), holes:h};
}
function freshState(){
  var c=defaultCourses();
  return {courses:c, prefTee:"Blanc", bag:DEFBAG.slice(), round:newRound("tj","Blanc")};
}

/* ---------- utilitaires ---------- */
function $(id){ return document.getElementById(id); }
function fmt(d){ return (Math.round(d*100)/100).toString().replace(".",","); }
function course(round){ return S.courses.find(function(c){return c.id===(round||R()).courseId;})||S.courses[0]; }
function tee(round){ var r=round||R(), c=course(r); return c.tees.find(function(t){return t.name===r.tee;})||c.tees[0]; }
function par(i){ return course().pars[i]||0; }
function dist(i){ var t=tee(); return (t&&t.dist[i])||0; }
function R(){ return S.round; }
function hole(i){ return R().holes[i]; }
function nPutts(h){ var c=0,i; for(i=0;i<h.shots.length;i++) if(h.shots[i].type==="putt") c++; return c; }
function nShots(h){ return h.shots.length; }
function status(h){ return h.done?"done":(h.shots.length?"todo":"empty"); }
function signed(v){ return v>0?"+"+v:(v===0?"0":""+v); }
function totals(round){
  var r=round||R(), pars=course(r).pars;
  var c=0,p=0,v=0,vp=0,parPlayed=0,gir=0,girN=0,fw=0,fwN=0,i,h,s0;
  for(i=0;i<18;i++){
    h=r.holes[i]; c+=nShots(h); p+=nPutts(h);
    if(h.done){ v++; vp+=nShots(h)-(pars[i]||0); parPlayed+=(pars[i]||0); }
    if(h.done&&holeComplete(h)){
      girN++; if(greenIn(h)<=(pars[i]||0)-2) gir++;
      s0=h.shots[0];
      if((pars[i]||0)>3&&s0&&s0.type==="long"&&s0.lie==="Départ"&&s0.to){ fwN++; if(s0.to==="Fairway") fw++; }
    }
  }
  return {c:c,p:p,v:v,vp:vp,parPlayed:parPlayed,gir:gir,girN:girN,fw:fw,fwN:fwN};
}
/* résumé d'un tour quelconque, y compris archivé */
function roundSummary(r){
  var co=null,i;
  for(i=0;i<S.courses.length;i++) if(S.courses[i].id===r.courseId) co=S.courses[i];
  var pars=co?co.pars:null, c=0,p=0,v=0,vp=0,gir=0,girN=0;
  r.holes.forEach(function(h,j){
    c+=h.shots.length;
    h.shots.forEach(function(s){ if(s.type==="putt") p++; });
    if(h.done){ v++; if(pars) vp+=h.shots.length-pars[j]; }
    if(h.done&&holeComplete(h)&&pars){ girN++; if(greenIn(h)<=pars[j]-2) gir++; }
  });
  return {name:(co?co.name:"Parcours"),tee:r.tee,type:r.type||"Partie amicale",date:r.date,
          c:c,p:p,v:v,vp:vp,gir:gir,girN:girN};
}
/* six tuiles : score en haut, statistiques classiques en bas */
function totTiles(t){
  t=t||totals();
  return '<div><b>'+t.c+'</b><span>Coups</span></div>'+
         '<div><b>'+(t.v?signed(t.vp):"—")+'</b><span>vs par</span></div>'+
         '<div><b>'+t.v+'/18</b><span>Validés</span></div>'+
         '<div><b>'+(t.fwN?t.fw+"/"+t.fwN:"—")+'</b><span>Fairways</span></div>'+
         '<div><b>'+(t.girN?t.gir+"/"+t.girN:"—")+'</b><span>GIR</span></div>'+
         '<div><b>'+t.p+'</b><span>Putts</span></div>';
}
function toast(msg,undo){
  var t=$("toast"); $("toastTxt").textContent=msg; lastUndo=undo||null;
  $("toastUndo").style.display=undo?"":"none"; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("on");lastUndo=null;},4000);
}
$("toastUndo").onclick=function(){ if(lastUndo) lastUndo(); $("toast").classList.remove("on"); lastUndo=null; };
function sheet(html,wire){ $("sheetIn").innerHTML=html; $("sheet").classList.add("on"); if(wire) wire(); }
function closeSheet(){ $("sheet").classList.remove("on"); }
$("sheet").onclick=function(e){ if(e.target===$("sheet")) closeSheet(); };
var currentView, suspendedShot=null;
function show(v){
  if(currentView==="Trou"&&v!=="Trou"&&(formOpen||draft)){
    suspendedShot={title:$("hTitle").textContent,subtitle:$("hSub").textContent,scroll:$("scroll").scrollTop};
  }
  currentView=v;
  ["vCarte","vTrou","vBilan","vParcours","vTraining","vHome","vProfile","vCourseMenu","vStats"].forEach(function(id){
    $(id).classList.toggle("hidden", id!=="v"+v);
  });
  var tabs={Home:"Home",Training:"Practice",CourseMenu:"Course",Carte:"Course",Trou:"Course",Parcours:"Course",Bilan:"Course",Stats:"Stats",Profile:"Profile"};
  ["Home","Practice","Course","Stats","Profile"].forEach(function(tab){

/* ---------- carte ---------- */
function courseBarHTML(){
  var c=course(), t=tee();
  var tot=0,i; for(i=0;i<18;i++) tot+=dist(i);
  return '<span class="t"><b>'+c.name+'</b><span>'+t.name+' · par '+c.pars.reduce(function(a,b){return a+b;},0)+
    (tot?' · '+tot+' m':' · distances à compléter')+' · '+displayRoundDate(R().date)+'</span></span>'+
    '<button class="btn small" style="width:auto;padding:0 14px" id="cEdit">Changer</button>';
}
function paintCarte(){
  show("Carte");
  $("hTitle").textContent="Carte du tour";
  var t=totals();
  $("hSub").textContent=t.v+"/18 trous · "+t.c+" coups";   // la date est passée sur la ligne du parcours
  $("courseBar").innerHTML=courseBarHTML();
  $("cEdit").onclick=paintParcours;
  $("totBox").innerHTML=totTiles();
  $("btnDeleteRound").classList.toggle("hidden",!t.c);

  var todo=R().holes.filter(function(h){return h.shots.length&&!h.done;});
  $("resume").innerHTML = todo.length
    ? '<div class="warn">'+todo.length+' trou'+(todo.length>1?'x':'')+' à compléter : '+todo.map(function(h){return h.n;}).join(", ")+'. Touche le trou pour reprendre.</div>'
    : "";

  var g=$("holes"); g.innerHTML="";
  R().holes.forEach(function(h,i){
    var st=status(h), d=dist(i);
    var mid = h.shots.length ? (h.done ? nShots(h)+" ("+signed(nShots(h)-par(i))+")" : nShots(h)+" c · "+nPutts(h)+" p") : "—";
    var b=document.createElement("button");
    b.className="hole "+st;
    b.innerHTML='<span class="n">'+h.n+'</span>'+
      '<span class="ref">Par '+par(i)+(d?' · '+d+' m':'')+'</span>'+
      '<span class="m">'+mid+'</span>'+
      '<span class="s">'+(st==="done"?"VALIDÉ":st==="todo"?"À COMPLÉTER":"NON SAISI")+'</span>';
    b.onclick=function(){ openHole(i); };
    g.appendChild(b);
  });

  if(t.v===18&&R().holes.every(holeComplete)){
    var saved=isCurrentRoundArchived();
    $("barIn").innerHTML='<button class="btn primary" id="go">'+
      (saved?"Partie enregistrée · Voir le bilan":"Terminer et enregistrer")+'</button>';
    $("go").onclick=saved?paintBilan:finishRound;
  }else{
    var next=todo[0]||R().holes.find(function(h){return !h.done||!holeComplete(h);});
    $("barIn").innerHTML='<button class="btn primary" id="go">'+
      (next.shots.length?"Reprendre le trou ":"Commencer le trou ")+next.n+'</button>';
    $("go").onclick=function(){openHole(next.n-1);};
  }
  paintStore();
}
function isCurrentRoundArchived(){
  return !!R().archiveId&&(S.archive||[]).some(function(round){
    return round.archiveId===R().archiveId&&JSON.stringify(round)===JSON.stringify(R());
  });
}
function archiveCurrentRound(){
  if(!R().archiveId) R().archiveId=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
  var copy=JSON.parse(JSON.stringify(R()));
  S.archive=(S.archive||[]).filter(function(round){return round.archiveId!==copy.archiveId;});
  S.archive.unshift(copy);
  S.archive=S.archive.slice(0,60);
}
function finishRound(){
  if(!R().holes.every(function(h){return h.done&&holeComplete(h);})) return;
  var previous=S.archive;
  archiveCurrentRound();
  save();
  if(!store.ok){
    S.archive=previous;
    if(currentView==="Home"||currentView==="CourseMenu") paintCarte();
    $("resume").innerHTML='<div class="warn" role="alert">Enregistrement indisponible. Réessaie sans fermer la page.</div>';
    return;
  }
  paintBilan();
}

/* ---------- trou ---------- */
function openHole(i){ suspendedShot=null; cur=i; draft=null; formOpen=false; paintHole(); }
function paintHole(){
  show("Trou");
  var h=hole(cur), d=dist(cur);
  $("hTitle").textContent="Trou "+h.n+" · Par "+par(cur);
  $("hSub").textContent=(d?d+" m":"distance à compléter")+" · "+
    nShots(h)+" coup"+(nShots(h)>1?"s":"")+" · "+nPutts(h)+" putt"+(nPutts(h)>1?"s":"")+(h.done?" · validé":"");
  $("holeRef").innerHTML="";            // repère parcours retiré : il tient dans la barre verte
  $("holeRef").style.display="none";    // le parcours et le départ se changent depuis la carte du tour
  paintShots(); paintEntry(); paintHoleBar();
}
function shotLine(s){
  if(s.type==="penalty") return {t:"Pénalité",s:"+1 coup"};
  if(s.type==="putt"){
    var d=DIRS.filter(function(x){return x[0]===s.res;})[0], sub=[];
    if(s.res!=="IN"){ sub.push(d?d[1]:s.res,"reste "+fmt(s.rest)+" m"); }
    if(s.brk) sub.push(s.brk+(s.amt&&s.amt!=="Nulle"?" "+s.amt.toLowerCase():""));
    if(s.slope) sub.push(s.slope);
    if(s.read) sub.push(s.read);
    if(s.exec&&s.exec.length) sub.push(s.exec.join(" + "));
    if(s.reasons&&s.reasons.length) sub.push(s.reasons.join(" + "));
    return {t:"Putt "+fmt(s.dist)+" m"+(s.res==="IN"?" — RENTRÉ":""), s:sub.join(" · ")||"—"};
  }
  var sub=s.lie;
  if(s.land) sub+=" → "+landLab(s.land)+(s.to&&s.to!=="Green"?" · "+s.to:"")+(s.short?" · côté court":"");
  else if(s.to) sub+=" → "+s.to+(s.side?(s.side==="G"?" gauche":" droite"):"");
  if(s.intent&&s.intent!=="Attaque") sub+=" · "+s.intent;
  if(!s.club) sub+=" · club non renseigné";
  return {t:(s.club?s.club+" · ":"")+s.dist+" m", s:sub};
}
function paintShots(){
  var h=hole(cur), w=$("shotList"); w.innerHTML="";
  if(!h.shots.length){
    w.innerHTML='<div class="card"><p class="label">Coups du trou</p><p class="muted">Aucun coup. La distance du premier coup est pré-remplie avec la longueur du trou.</p></div>';
    return;
  }
  var c=document.createElement("div"); c.className="card";
  c.innerHTML='<p class="label">Coups du trou — touche un coup pour corriger</p>';
  h.shots.forEach(function(s,idx){
    var l=shotLine(s), b=document.createElement("button");
    b.className="shot "+(s.type==="putt"?"putt":s.type==="penalty"?"pen":"");
    b.innerHTML='<span class="idx">'+(idx+1)+'</span><span class="t"><b>'+l.t+'</b><span>'+l.s+'</span></span><span class="chev">›</span>';
    b.onclick=function(){ editShot(idx); };
    c.appendChild(b);
  });
  w.appendChild(c);
}
function editShot(idx){
  var h=hole(cur), s=h.shots[idx], l=shotLine(s);
  sheet('<h3>Coup '+(idx+1)+' — '+l.t+'</h3><p class="muted" style="margin:0 0 6px">'+l.s+'</p>'+
    '<button class="btn" id="sIns">Insérer un coup oublié avant</button>'+
    '<button class="btn" id="sAft">Insérer un coup oublié après</button>'+
    '<button class="btn danger" id="sDel">Supprimer ce coup</button>'+
    '<button class="btn ghost" id="sCan">Fermer</button>',
    function(){
      $("sCan").onclick=closeSheet;
      $("sDel").onclick=function(){
        var rm=h.shots.splice(idx,1)[0]; h.done=false; save(); closeSheet(); paintHole();
        toast("Coup supprimé — trou à compléter",function(){ h.shots.splice(idx,0,rm); save(); paintHole(); });
      };
      $("sIns").onclick=function(){ closeSheet(); draft={insertAt:idx}; paintEntry(true); };
      $("sAft").onclick=function(){ closeSheet(); draft={insertAt:idx+1}; paintEntry(true); };
    });

/* ---------- saisie ---------- */
function paintEntry(scroll){
  var h=hole(cur), e=$("entry");
  var ins=(draft&&draft.insertAt!=null)?draft.insertAt:null;
  var num=(ins!=null?ins:h.shots.length)+1;
  var prefill=null;
  if(ins==null){
    var last=h.shots[h.shots.length-1];
    if(last&&last.type==="putt"&&last.res!=="IN") prefill=last.rest;
  }
  if(h.done&&ins==null){
    e.innerHTML='<p class="label">Trou validé</p><p class="muted">« Rouvrir le trou » en bas pour corriger.</p>';
    return;
  }
  /* premier coup d'un trou : c'est forcément un départ en jeu long — on saute le choix */
  if(ins==null && !h.shots.length && !h.done){ formLong(null,1,true); return; }
  var prev=h.shots[h.shots.length-1];
  var needTo=(ins==null && prev && prev.type==="long" && prev.lie==="Départ" && !prev.to);
  /* balle sur le green : le coup suivant ne peut être qu'un putt */
  var onGreen = (ins==null && !!prev &&
    ((prev.type==="putt"&&prev.res!=="IN") ||
     (prev.type==="long"&&(prev.land==="GREEN"||prev.to==="Green"))));
  e.innerHTML=(needTo
      ? '<p class="label">Résultat du départ — où est partie la balle ?</p>'+
        '<div class="rowscroll" id="toc"></div>'
      : '')+
    '<p class="label">'+(ins!=null?"Coup oublié — position "+num:"Coup n° "+num)+
      (onGreen?" — balle sur le green":"")+'</p>'+
    (onGreen
      ? '<button class="btn primary" id="ePutt">Putt'+(prefill?" "+fmt(prefill)+" m":"")+'</button>'+
        '<button class="btn small" id="ePen" style="margin-top:10px">Ajouter une pénalité (+1)</button>'+
        '<button class="btn ghost" id="eLong">La balle n’était pas sur le green</button>'

        '<button class="btn small" id="ePen">Ajouter une pénalité (+1)</button>')+
    (ins!=null?'<button class="btn ghost" id="eCan">Annuler l’insertion</button>':'');
  if(needTo){

/* position de balle déduite du résultat du coup précédent */
function lieFromPrev(num,ins){
  if(num===1) return "Départ";
  var h=hole(cur), p=h.shots[(ins!=null?ins:h.shots.length)-1];
  if(p && p.to && LIES.indexOf(p.to)>=0) return p.to;
  return "Fairway";
}
function formLong(ins,num,autoTee){
  var tee1=(num===1);   // départ : position de balle imposée, pas de choix à faire
  var base = (num===1 && dist(cur)) ? dist(cur) : 100;   // point de départ des boutons − et +, pas une valeur inscrite
  var st={lie:lieFromPrev(num,ins), dist:null, intent:null,
          club:(num===1 && par(cur)>3) ? "Dr" : null};
  var e=$("entry");
  function sync(){ var el=$("dv"); if(!el) return; var v=parseInt(el.value,10); st.dist=(v>0)?v:null; }
  /* l'intention ne sert que là où il y a un vrai choix : long deuxième coup, ou sortie de difficulté */
  /* au départ, le club dit déjà l'intention : on ne demande rien de plus */
  function needIntent(){ return !tee1 && ((st.dist&&st.dist>180) || (par(cur)===5 && num===2) || st.lie==="Arbres"); }
  function toggleIntent(){ var b=$("intBox"); if(b) b.classList.toggle("hidden", !needIntent()); }
  function render(){
    e.innerHTML=(tee1?'':'<p class="label">1 · Position de balle</p><div class="rowscroll" id="lies"></div>')+
      '<p class="label">'+(tee1?'1':'2')+' · Club'+(tee1?' au départ':'')+(st.club?' — '+st.club:'')+'</p><div class="rowscroll" id="clubs"></div>'+
      '<p class="label">'+(tee1?'2 · Longueur du trou':'3 · Distance au drapeau')+'</p>'+
      '<div class="stepper"><button id="mm">−</button>'+
        '<input class="bigin" id="dv" type="number" inputmode="numeric" step="1" min="1" placeholder="—" value="'+(st.dist||"")+'">'+
        '<button id="pp">+</button></div>'+
      '<div class="bigu">valeur du télémètre (m)</div>'+
      '<div id="intBox" class="'+(needIntent()?"":"hidden")+'" style="margin-bottom:14px">'+
        '<p class="label">Intention</p><div class="rowscroll" id="cint" style="margin-bottom:4px"></div></div>'+
      (num===1&&dist(cur)?'<div class="chips" id="quick" style="margin-bottom:10px"></div>':'')+
      '<button class="btn primary" id="ok" style="margin-top:8px">'+(tee1?'Enregistrer le départ':'Enregistrer le coup')+'</button>'+
      (tee1?'<button class="btn small" id="pen" style="margin-top:10px">Ajouter une pénalité (+1)</button>':'')+
      (autoTee?'':'<button class="btn ghost" id="ca">Annuler</button>');
    var g=$("lies");
    if(g) LIES.forEach(function(l){
      var b=document.createElement("button");
      b.className="btn small"+(st.lie===l?" sel":""); b.textContent=l;
      b.onclick=function(){ sync(); st.lie=l; render(); }; g.appendChild(b);
    });
    if($("pen")) $("pen").onclick=function(){ addShot({type:"penalty"},ins); };
    var cw=$("clubs");
    (S.bag||DEFBAG).forEach(function(cl){
      var b=document.createElement("button");
      b.className="chip"+(st.club===cl?" sel":""); b.textContent=cl;
      b.onclick=function(){ sync(); st.club=(st.club===cl?null:cl); render(); }; cw.appendChild(b);
    });
    if($("quick")){
      var b2=document.createElement("button");
      b2.className="chip"; b2.style.flex="1 0 100%";
      b2.textContent="Longueur du trou — "+dist(cur)+" m";
      b2.onclick=function(){ st.dist=dist(cur); render(); };
      $("quick").appendChild(b2);
    }
    var iw=$("cint");
    INTENTS.forEach(function(x){
      var b=document.createElement("button");
      b.className="chip"+(st.intent===x?" sel":""); b.textContent=x;
      b.onclick=function(){ sync(); st.intent=(st.intent===x?null:x); render(); }; iw.appendChild(b);
    });
    $("dv").oninput=function(){ sync(); toggleIntent(); };
    $("mm").onclick=function(){ sync(); st.dist=st.dist?Math.max(1,st.dist-5):base; $("dv").value=st.dist; toggleIntent(); };
    $("pp").onclick=function(){ sync(); st.dist=st.dist?st.dist+5:base; $("dv").value=st.dist; toggleIntent(); };
    $("ok").onclick=function(){ sync();
      if(!st.dist){ toast("Distance manquante"); $("dv").focus(); return; }   // rien ne part sans distance
      addShot({type:"long",lie:st.lie,dist:st.dist,club:st.club,
      intent:(needIntent()?st.intent:null)},ins); };
    if($("ca")) $("ca").onclick=function(){ draft=null; formOpen=false; paintEntry(); paintHoleBar(); };
  }
  /* le départ s'ouvre tout seul : la barre du bas reste celle du trou */
  if(!autoTee){ formOpen=true; }
  paintHoleBar();
  render(); if(!autoTee) e.scrollIntoView({behavior:"smooth",block:"start"});
}
function puttScale(){
  var a=[],v;
  for(v=0.25; v<=6.001; v+=0.25) a.push(Math.round(v*100)/100);
  for(v=6.5;  v<=12.001; v+=0.5) a.push(Math.round(v*100)/100);
  for(v=13;   v<=25.001; v+=1)   a.push(v);
  return a;
}
function formPutt(ins,prefill){
  var st={dist:prefill||null,res:null,rest:0.5,brk:null,amt:null,slope:null,read:null,exec:[]};
  var e=$("entry");
  function sync(){
    var el=$("dv"); if(!el) return;
    var v=parseFloat(String(el.value).replace(",","."));
    st.dist=(v>0)?v:null;
  }
  function renderDist(){
    e.innerHTML='<p class="label">1 · Longueur du putt</p>'+
      '<div class="stepper"><button id="mm">−</button>'+
        '<input class="bigin" id="dv" type="number" inputmode="decimal" step="0.25" min="0.25" placeholder="—" value="'+(st.dist||"")+'">'+
        '<button id="pp">+</button></div>'+
      '<div class="bigu">mètres</div>'+
      '<div class="wheel"><div class="track" id="quick"></div><span class="mark"></span></div>'+
      (prefill?'<p class="muted" style="text-align:center;margin:8px 0 0">Distance restante du putt précédent</p>':'')+
      '<button class="btn primary" id="next" style="margin-top:12px">Résultat du putt</button>'+
      '<button class="btn ghost" id="ca">Annuler</button>';
    var q=$("quick"), vals=puttScale(), sel=null, deux=null;
    vals.forEach(function(v){
      var rond=(Math.abs(v-Math.round(v))<0.01);
      var demi=(Math.abs(v*2-Math.round(v*2))<0.01);
      var ecrit=rond||(demi&&v<=6);                 // chiffre tous les 50 cm jusqu'à 6 m, puis au mètre
      var b=document.createElement("button");
      b.className=(rond?"big":"")+(st.dist===v?" sel":"");
      b.innerHTML='<span>'+(ecrit||st.dist===v?fmt(v):"")+'</span><i></i>';
      b.onclick=function(){ st.dist=v; renderDist(); };
      if(st.dist===v) sel=b;
      if(Math.abs(v-2)<0.01) deux=b;
      q.appendChild(b);
    });
    (sel||deux||q.firstChild).scrollIntoView({block:"nearest",inline:"center"});
    $("mm").onclick=function(){ sync(); st.dist=st.dist?Math.max(0.25,Math.round((st.dist-0.25)*4)/4):1; renderDist(); };
    $("pp").onclick=function(){ sync(); st.dist=st.dist?Math.round((st.dist+0.25)*4)/4:1; renderDist(); };
    $("next").onclick=function(){ sync();
      if(!st.dist){ toast("Longueur du putt manquante"); $("dv").focus(); return; }
      renderRes(); };
    $("ca").onclick=function(){ draft=null; formOpen=false; paintEntry(); paintHoleBar(); };
  }
  function renderRes(){
    e.innerHTML='<p class="label">2 · Où la balle s’est arrêtée — putt de '+fmt(st.dist)+' m</p><div class="pad" id="pad"></div>'+
      '<button class="btn ghost" id="back">Changer la distance</button>';
    var p=$("pad");
    DIRS.forEach(function(d){
      var b=document.createElement("button");
      b.className=d[0]==="IN"?"gr m":"m";
      b.innerHTML=d[0]==="IN"?"RENTRÉ":d[1].replace("-","<br>");
      b.onclick=function(){ st.res=d[0]; if(d[0]==="IN"){ st.rest=0; renderOpt(); } else renderRest(); };
      p.appendChild(b);
    });
    $("back").onclick=renderDist;
  }
  function renderRest(){
    e.innerHTML='<p class="label">3 · Distance restante</p><div class="big" id="dv">'+fmt(st.rest)+'</div>'+
      '<div class="bigu">mètres — deviendra le putt suivant</div>'+
      '<div class="stepper"><button id="mm">−</button><div class="chips one" id="quick"></div><button id="pp">+</button></div>'+
      '<button class="btn primary" id="next" style="margin-top:12px">Continuer</button>'+
      '<button class="btn ghost" id="back">Changer le résultat</button>';
    var q=$("quick");
    QR.forEach(function(v){
      var b=document.createElement("button"); b.className="chip"+(st.rest===v?" sel":""); b.textContent=fmt(v);
      b.onclick=function(){ st.rest=v; renderRest(); }; q.appendChild(b);
    });
    $("mm").onclick=function(){ st.rest=Math.max(0,Math.round((st.rest-0.25)*4)/4); $("dv").textContent=fmt(st.rest); };
    $("pp").onclick=function(){ st.rest=Math.round((st.rest+0.25)*4)/4; $("dv").textContent=fmt(st.rest); };
    $("next").onclick=renderOpt; $("back").onclick=renderRes;
  }
  function renderOpt(){
    e.innerHTML='<p class="label">'+(st.res==="IN"?"Putt rentré de "+fmt(st.dist)+" m":"Détail — facultatif")+'</p>'+
      '<div class="opt" style="border-top:none;margin-top:0;padding-top:0">'+
      '<p class="label">Cassure — sens</p><div class="chips one" id="cb" style="margin-bottom:14px"></div>'+
      '<p class="label">Cassure — taille</p><div class="chips one" id="ca2" style="margin-bottom:14px"></div>'+
      '<p class="label">Pente</p><div class="chips one" id="cs" style="margin-bottom:14px"></div>'+
      (st.res!=="IN"
        ? '<p class="label">Erreur de lecture — un seul choix</p><div class="grid g3" id="crd" style="margin-bottom:14px"></div>'+
          '<p class="label">Exécution — plusieurs possibles</p><div class="chips one" id="cex"></div>'
        : '')+
      '<p class="muted" style="margin:12px 0 16px">Laisse vide si tu n’as pas observé. Le bilan donne le taux de renseignement.</p></div>'+
      '<button class="btn primary" id="ok">Enregistrer le putt</button>'+
      '<button class="btn ghost" id="back">Revenir</button>';
    function set(id,list,get,fn){
      var w=$(id); if(!w) return;
      list.forEach(function(v){
        var b=document.createElement("button"); b.className="chip"+(get(v)?" sel":""); b.textContent=v;
        b.onclick=function(){ fn(v); renderOpt(); }; w.appendChild(b);
      });
    }
    function setBtn(id,list,get,fn){           // boutons larges pour la lecture
      var w=$(id); if(!w) return;
      list.forEach(function(v){
        var b=document.createElement("button");
        b.className="btn small"+(get(v)?" sel":""); b.textContent=v;
        b.onclick=function(){ fn(v); renderOpt(); }; w.appendChild(b);
      });
    }
    set("cb",BREAKS,function(v){return st.brk===v;},function(v){ st.brk=st.brk===v?null:v; });
    set("ca2",AMOUNTS,function(v){return st.amt===v;},function(v){ st.amt=st.amt===v?null:v; });
    set("cs",SLOPES,function(v){return st.slope===v;},function(v){ st.slope=st.slope===v?null:v; });
    setBtn("crd",READS,function(v){return st.read===v;},function(v){ st.read=st.read===v?null:v; });
    set("cex",EXECS,function(v){return st.exec.indexOf(v)>=0;},function(v){
      var i=st.exec.indexOf(v); if(i>=0) st.exec.splice(i,1); else st.exec.push(v);
    });
    $("ok").onclick=function(){
      addShot({type:"putt",dist:st.dist,res:st.res,rest:st.res==="IN"?0:st.rest,
               brk:st.brk,amt:st.amt,slope:st.slope,
               read:st.read,exec:st.exec.slice()},ins);
    };
    $("back").onclick=function(){ if(st.res==="IN") renderRes(); else renderRest(); };
  }
  formOpen=true; paintHoleBar();
  renderDist(); e.scrollIntoView({behavior:"smooth",block:"start"});
}
function addShot(s,ins){
  var h=hole(cur), at=(ins!=null)?ins:h.shots.length;
  h.shots.splice(at,0,s);
  if(ins!=null) h.done=false;
  draft=null; formOpen=false; save();
  var label = s.type==="penalty"?"Pénalité enregistrée"
            : s.type==="putt"?(s.res==="IN"?"Putt rentré enregistré":"Putt enregistré")
            : "Coup "+(at+1)+" enregistré";
  toast(label+" ✓  ("+nShots(h)+" coups · "+nPutts(h)+" putts)",function(){
    h.shots.splice(at,1); save(); paintHole();
  });
  paintHole();
  if(s.type==="long"&&ins==null){
    if(s.lie==="Départ" && par(cur)>3) askTeeResult(at);   // départ par 4 / 5 : fairway ou côté
    else askApproachResult(at);                            // approche, par 3 compris : pavé green
  }
  else if(s.type==="putt"&&s.res==="IN"&&ins==null) askValidate();
}
/* résultat d'une approche : pavé 3×3 autour du green + position de balle */
function askApproachResult(idx){
  var h=hole(cur), s=h.shots[idx];
  function lab(){
    if(!s.land) return "Résultat non renseigné";
    if(s.land==="GREEN") return "Green touché";
    return landLab(s.land)+(s.to?" · "+s.to:"");
  }
  function draw(){
    var miss = s.land && s.land!=="GREEN";
    sheet('<h3>Où la balle s’est arrêtée ?</h3>'+
      '<p class="muted" style="margin:0 0 6px">Trou '+h.n+' · par '+par(cur)+(s.club?' · '+s.club:'')+' · '+s.dist+' m</p>'+
      '<div class="pad" id="ap"></div>'+
      '<button class="btn" id="aIn" style="margin-top:12px">⛳ Balle rentrée — aucun putt</button>'+
      '<p class="label" style="margin-top:16px">Drapeau</p><div class="chips one" id="apin"></div>'+
      (miss?'<p class="label" style="margin-top:14px">Position de balle</p><div class="chips" id="al"></div>'+
            '<button class="btn small" id="aShort" style="margin-top:10px">'+
            (s.short?"✓ Côté court":"Côté court")+'</button>':'')+
      (miss?'<button class="btn primary" id="aOk" style="margin-top:12px">Enregistrer</button>':'')+
      '<button class="btn ghost" id="aSkip">Passer</button>',
      function(){
        var w=$("ap");
        LAND.forEach(function(d){
          var b=document.createElement("button");
          b.className=d[0]==="GREEN"?"gr m":"m";
          b.innerHTML=d[1].replace("-","<br>");
          if(s.land===d[0]) b.style.boxShadow="inset 0 0 0 3px var(--blue)";
          b.onclick=function(){
            s.land=d[0];
            if(d[0]==="GREEN"){ s.to="Green"; save(); closeSheet(); paintHole(); toast("Green touché ✓"); }
            else { if(s.to==="Green") s.to=null; draw(); }
          };
          w.appendChild(b);
        });
        var pw=$("apin");
        PINS.forEach(function(x){
          var b=document.createElement("button");
          b.className="chip"+(s.pin===x?" sel":""); b.textContent=x;
          b.onclick=function(){ s.pin=(s.pin===x?null:x); draw(); }; pw.appendChild(b);
        });
        var l=$("al");
        if(l) APLIES.forEach(function(x){
          var b=document.createElement("button");
          b.className="chip"+(s.to===x?" sel":""); b.textContent=x;
          b.onclick=function(){ s.to=x; draw(); }; l.appendChild(b);
        });
        if($("aShort")){
          if(s.short) $("aShort").classList.add("sel");
          $("aShort").onclick=function(){ s.short=!s.short; draw(); };
        }
        $("aIn").onclick=function(){
          s.land="GREEN"; s.to="Green"; s.holed=true;
          save(); closeSheet(); paintHole(); toast("Balle rentrée ✓"); askValidate();
        };
        if($("aOk")) $("aOk").onclick=function(){ save(); closeSheet(); paintHole(); toast(lab()+" ✓"); };
        $("aSkip").onclick=closeSheet;
      });
  }
  draw();
}
/* résultat du coup de départ : où finit la balle, et de quel côté */
function askTeeResult(idx){
  var h=hole(cur), s=h.shots[idx];
  var opts = par(cur)===3 ? ["Green","Bunker","Rough","Arbres","Eau / HL"]
                          : ["Fairway","Rough","Bunker","Arbres","Eau / HL"];
  function done(msg){ save(); closeSheet(); paintHole(); toast("Départ : "+msg+" ✓"); }
  function step1(){
    sheet('<h3>Coup de départ — où est la balle ?</h3>'+
      '<p class="muted" style="margin:0 0 6px">Trou '+h.n+' · par '+par(cur)+'</p>'+
      '<div class="grid g2" id="tr"></div>'+
      '<button class="btn" id="tIn" style="margin-top:10px">⛳ Balle rentrée — aucun putt</button>'+
      '<button class="btn ghost" id="tSkip">Je verrai en arrivant</button>',
      function(){
        var w=$("tr");
        opts.forEach(function(o){
          var b=document.createElement("button"); b.className="btn"; b.textContent=o;
          b.onclick=function(){
            s.to=o; s.side=null;
            if(o==="Rough"||o==="Arbres") step2(); else done(o);
          };
          w.appendChild(b);
        });
        $("tIn").onclick=function(){
          s.to="Green"; s.side=null; s.holed=true;
          save(); closeSheet(); paintHole(); toast("Balle rentrée du départ ✓"); askValidate();
        };
        $("tSkip").onclick=closeSheet;
      });
  }
  function step2(){
    sheet('<h3>'+s.to+' — de quel côté ?</h3>'+
      '<div class="grid g2" id="sd"></div>'+
      '<button class="btn ghost" id="sSkip">Sans précision</button>',
      function(){
        var w=$("sd");
        [["G","Gauche"],["D","Droite"]].forEach(function(x){
          var b=document.createElement("button"); b.className="btn"; b.textContent=x[1];
          b.onclick=function(){ s.side=x[0]; done(s.to+" "+x[1].toLowerCase()); };
          w.appendChild(b);
        });
        $("sSkip").onclick=function(){ done(s.to); };
      });
  }
  step1();
}
function askValidate(){
  var h=hole(cur), sc=nShots(h)-par(cur);
  sheet('<h3>Trou '+h.n+' terminé ?</h3>'+
    '<p class="muted" style="margin:0 0 6px">'+nShots(h)+' coups sur un par '+par(cur)+' — '+signed(sc)+' · '+nPutts(h)+' putts.</p>'+
    '<button class="btn primary" id="vOk">Valider le trou '+h.n+'</button>'+
    '<button class="btn" id="vNext">Valider et passer au trou '+(h.n<18?h.n+1:18)+'</button>'+
    '<button class="btn ghost" id="vLater">Laisser à compléter</button>',
    function(){
      $("vOk").onclick=function(){ h.done=true; save(); closeSheet(); paintHole(); };
      $("vNext").onclick=function(){ h.done=true; save(); closeSheet(); if(h.n<18) openHole(h.n); else paintCarte(); };
      $("vLater").onclick=closeSheet;
    });
}
/* nombre de coups joués pour atteindre le green, déduit de la séquence : pas besoin d'étiquette */
function greenIn(h){
  for(var j=0;j<h.shots.length;j++){
    if(h.shots[j].type==="putt") return j;   // les coups avant le premier putt
    if(h.shots[j].holed) return j+1;         // balle rentrée sans putt
  }
  return h.shots.length;
}
/* un trou n'est terminé que si la balle est au fond : putt rentré, ou coup rentré confirmé */
function holeComplete(h){
  var last=h.shots[h.shots.length-1];
  return !!last && ((last.type==="putt"&&last.res==="IN") || last.holed===true);
}
function validateHole(){
  var h=hole(cur);
  if(!h.shots.length){ toast("Aucun coup à valider"); return; }
  if(holeComplete(h)){ h.done=true; save(); paintHole(); toast("Trou "+h.n+" validé ✓"); return; }
  var last=h.shots[h.shots.length-1], l=shotLine(last);
  sheet('<h3>Trou '+h.n+' — aucun putt rentré</h3>'+
    '<p class="muted" style="margin:0 0 6px">Dernier coup enregistré : '+l.t+'. Si tu as rentré un putt, il n’est pas encore enregistré.</p>'+
    '<button class="btn primary" id="vAdd">Ajouter le putt rentré</button>'+
    '<button class="btn" id="vChip">Balle rentrée sans putt</button>'+
    '<button class="btn ghost" id="vNo">Annuler</button>',
    function(){
      $("vNo").onclick=closeSheet;
      $("vAdd").onclick=function(){ closeSheet(); formPutt(null,null); };
      $("vChip").onclick=function(){
        last.holed=true; h.done=true; save(); closeSheet(); paintHole();
        toast("Trou "+h.n+" validé — balle rentrée sans putt");
      };
    });
}
function paintHoleBar(){
  var h=hole(cur);
  if(formOpen){   // saisie en cours : rien qui puisse la faire disparaître sans le dire
    $("barIn").innerHTML='<button class="btn small" id="bAnn">Annuler la saisie du coup</button>';
    $("bAnn").onclick=function(){ draft=null; formOpen=false; paintHole(); };
    return;
  }
  $("barIn").innerHTML='<div class="grid g2"><button class="btn small" id="bCarte">Carte du tour</button>'+
    (h.done?'<button class="btn small" id="bOpen">Rouvrir le trou</button>'
           :'<button class="btn small" id="bVal">Valider le trou</button>')+'</div>';
  $("bCarte").onclick=paintCarte;
  if(h.done) $("bOpen").onclick=function(){ h.done=false; save(); paintHole(); toast("Trou rouvert"); };
  else $("bVal").onclick=validateHole;
}

/* ---------- bilan ---------- */
function paintBilan(){paintRoundReport(R());}
function roundHistory(){
  return (S.archive||[]).slice().sort(function(a,b){
    return (b.date||"").localeCompare(a.date||"");
  });
}
function latestFinishedRound(){
  return roundHistory().find(function(round){
    return round.holes.every(function(h){return h.done&&holeComplete(h);});
  });
}
function roundSG(round){
  var pars=course(round).pars;
  /* ---- coups gagnés : E(départ) − E(arrivée) − 1, sur les trous validés ---- */
  function eAt(h,i){
    var s=h.shots[i]; if(!s||s.type==="penalty") return null;
    return s.type==="putt" ? ePutt(s.dist) : eLong(s.dist,s.lie);
  }
  function catOf(s,p){
    if(s.type==="putt") return "Putting";
    if(s.lie==="Départ"&&p>3) return "Départ";
    return s.dist<30 ? "Petit jeu" : "Approches";
  }
  var CATS=["Départ","Approches","Petit jeu","Putting","Pénalités"];
  var SG={}, putts2=[], sgHoles=0;
  CATS.forEach(function(c){ SG[c]={n:0,v:0}; });
  round.holes.forEach(function(h,hi){
    if(!h.done||!holeComplete(h)) return;
    sgHoles++;
    var p=pars[hi]||0;
    h.shots.forEach(function(s,i){
      if(s.type==="penalty"){ SG["Pénalités"].n++; SG["Pénalités"].v-=1; return; }
      var e0=eAt(h,i); if(e0==null) return;
      var j=i+1; while(h.shots[j]&&h.shots[j].type==="penalty") j++;
      var e1 = h.shots[j] ? eAt(h,j) : 0;
      if(e1==null) return;
      var v=e0-e1-1, c=catOf(s,p);
      SG[c].n++; SG[c].v+=v;
      if(s.type==="putt") putts2.push({v:v,d:s.dist,brk:s.brk,amt:s.amt,slope:s.slope,res:s.res,read:s.read,exec:s.exec||[],reasons:s.reasons||[],rest:s.rest,hole:h.n,date:displayRoundDate(round.date)});
    });
  });
  return {SG:SG,putts:putts2,holes:sgHoles};
}
  function puttGroups(list,keyf,keys,showDate){
    var groups=keys.map(function(k){
      var items=list.filter(function(x){return keyf(x)===k;});
      return {label:k,items:items,sg:items.reduce(function(sum,x){return sum+x.v;},0)};
    });
    var max=Math.max(0.01,...groups.map(function(g){return Math.abs(g.sg);}));
    var columns=showDate?groups.map(function(g,i){
      var n=g.items.length, magnitude=Math.abs(g.sg)/max*48;
      return '<button type="button" class="putt-column" data-putt-column="'+i+'" aria-pressed="false"'+
        (n?'':' disabled')+'><span class="putt-column-plot" aria-hidden="true">'+
        (n?'<span class="putt-column-mark'+(g.sg<0?' loss':'')+'" style="top:'+
          (g.sg<0?50:50-magnitude)+'%;height:'+magnitude+'%"></span>':'')+'</span>'+
        '<span class="putt-column-value">'+(n?sgFmt(g.sg):"—")+'</span>'+
        '<span class="putt-column-label">'+g.label+'</span><span class="putt-column-count">'+n+'</span></button>';
    }).join(""):"";
    return '<p class="muted">'+list.length+' putts pris en compte · SG total</p>'+
      (showDate?'<div class="putt-column-grid" style="grid-template-columns:repeat('+groups.length+',minmax(0,1fr))">'+columns+'</div>':'')+
      groups.map(function(g,index){
      var n=g.items.length;
      if(!n) return showDate?'':'<p class="muted">'+g.label+' · 0 putt · —</p>';
      var misses=g.items.filter(function(x){return x.res&&x.res!=="IN";});
      function reasonsFor(x){
        return Array.from(new Set([x.read].concat(x.exec,x.reasons)))
          .filter(function(tag){return READS.includes(tag)||EXECS.includes(tag)||REASONS.includes(tag);});
      }
      var tagged=misses.filter(function(x){return reasonsFor(x).length;}).length;
      var tags={};
      misses.forEach(function(x){
        reasonsFor(x).forEach(function(tag){tags[tag]=(tags[tag]||0)+1;});
      });
      var reasons=Object.keys(tags).sort(function(a,b){return tags[b]-tags[a];})
        .map(function(tag){return {label:tag,count:tags[tag],color:"var(--blue)"};});
      var pattern=[
        {label:"Long",count:misses.filter(function(x){return x.res[0]==="L";}).length,color:"var(--red)"},
        {label:"Gauche",count:misses.filter(function(x){return x.res[1]==="G";}).length,color:"var(--blue)"},
        {label:"Droite",count:misses.filter(function(x){return x.res[1]==="D";}).length,color:"var(--ok)"},
        {label:"Court",count:misses.filter(function(x){return x.res[0]==="C";}).length,color:"var(--todo)"},
        {label:"À hauteur",count:misses.filter(function(x){return x.res[0]==="H";}).length,color:"var(--ink2)"}
      ];
      var width=Math.abs(g.sg)/max*50;
      var bar='<span aria-hidden="true" class="putt-track"><span style="left:'+
        (g.sg<0?50-width:50)+'%;width:'+width+'%;background:'+
        (g.sg<0?'var(--red)':'var(--ok)')+'"></span></span>';
      var head=showDate?'<div class="putt-detail hidden" data-putt-detail="'+index+'"><h4>'+g.label+'</h4>':
        '<details class="putt-group"><summary><b>'+g.label+'</b> · '+sgFmt(g.sg)+' SG · '+n+
        (n===1?' putt':' putts')+bar+'</summary><div class="putt-detail">';
      return head+
        '<div class="putt-kpis"><div><b>'+sgFmt(g.sg/n)+'</b>SG / putt</div>'+
        '<div><b>'+misses.length+'</b>Putts manqués</div></div>'+
        puttMissVisual(pattern,reasons,tagged,misses.length)+
        '<details class="putt-shot-list"><summary>Voir les '+n+(n===1?' putt':' putts')+'</summary><ul>'+g.items.map(function(x){
          var result=x.res==="IN"?"Rentré":(DIRS.find(function(pair){return pair[0]===x.res;})||[null,"Raté"])[1];
          var why=reasonsFor(x);
          return '<li>'+(showDate?x.date+' · ':'')+'Trou '+x.hole+' · '+fmt(x.d)+' m · '+result+
            (x.res!=="IN"&&x.rest!=null?' · reste '+fmt(x.rest)+' m':'')+
            (why.length?' · '+why.join(', '):'')+' · '+sgFmt(x.v)+' SG</li>';
        }) .join('')+'</ul></details></div>'+(showDate?'':'</details>');
    }).join('');
  }
function puttMissVisual(pattern,reasons,tagged,total){
  if(!total) return '<p class="muted">Aucun putt manqué dans ce groupe.</p>';
  function bars(rows,max){
    return '<ul class="miss-bars">'+rows.map(function(row){
      return '<li><span>'+row.label+'</span><span class="miss-bar" aria-hidden="true"><i style="width:'+
        (row.count/max*100)+'%;background:'+row.color+'"></i></span><b>'+row.count+'</b></li>';
    }).join("")+'</ul>';
  }
  var positions=["top","left","right","bottom"];
  return '<section class="miss-visual"><h4>Dispersion des ratés</h4>'+
    '<div class="miss-target" aria-hidden="true">'+pattern.slice(0,4).map(function(row,i){
      return '<div class="miss-target-'+positions[i]+'"><b style="color:'+row.color+'">'+
        row.count+'</b><span>'+row.label+'</span></div>';
    }).join("")+'</div>'+bars(pattern,total)+'</section>'+
    '<section class="miss-visual"><h4>Raisons déclarées <small>'+tagged+'/'+total+'</small></h4>'+
    (tagged?bars(reasons,tagged):'<p class="muted">Aucune raison renseignée.</p>')+'</section>';
}
  function band(d){ return d<2?"moins de 2 m":d<4?"2 à 4 m":d<7?"4 à 7 m":d<11?"7 à 11 m":"plus de 11 m"; }
function puttingCharts(putts,showDate){
  function chart(title,list,key,labels,note){
    return (showDate?'<div class="card putt-chart">':'')+'<h3>'+title+'</h3>'+
      (note?'<p class="muted">'+note+'</p>':'')+puttGroups(list,key,labels,showDate)+(showDate?'</div>':'');
  }
  return chart("SG par distance",putts,function(x){return band(x.d);},
    ["moins de 2 m","2 à 4 m","4 à 7 m","7 à 11 m","plus de 11 m"])+
    chart("SG par sens de cassure",putts.filter(function(x){return x.brk;}),function(x){return x.brk;},BREAKS)+
    chart("SG par intensité de cassure",putts.filter(function(x){return x.amt;}),function(x){return x.amt;},AMOUNTS)+
    chart("SG par pente",putts.filter(function(x){return x.slope;}),function(x){return x.slope;},SLOPES)+
    chart("Dosage des putts manqués",putts.filter(function(x){return x.res&&x.res!=="IN";}),function(x){
      return x.res[0]==="C"?"Court":x.res[0]==="L"?"Long":"Hauteur du trou";
    },["Court","Long","Hauteur du trou"],"SG des putts regroupés par position d’arrêt.");
}
function bindPuttingColumns(container){
  container.onclick=function(event){
    var button=event.target.closest("[data-putt-column]");
    if(!button) return;
    var chart=button.closest(".putt-chart");
    var open=button.getAttribute("aria-pressed")!=="true";
    chart.querySelectorAll("[data-putt-column]").forEach(function(column){
      column.setAttribute("aria-pressed",String(open&&column===button));
    });
    chart.querySelectorAll("[data-putt-detail]").forEach(function(detail){
      detail.classList.toggle("hidden",!open||detail.dataset.puttDetail!==button.dataset.puttColumn);
    });
  };
}

/* ============ AGRÉGATION PAR COMPÉTENCE ============
   Toutes les séances d'une même famille, cumulées sur la période,
   avec l'effectif sur chaque ligne et la tendance séance par séance. */
function skillPct(ok,n){ return n?Math.round(ok/n*100)+" %":"—"; }
function skillRow(lab,ok,n,extra){
  return '<tr><td>'+lab+'</td><td>'+(n?ok+"/"+n:"—")+'</td><td>'+skillPct(ok,n)+(extra?' · '+extra:'')+'</td></tr>';
}
function skillTrend(sessions,rate,title){
  var rows=sessions.slice(0,8).map(function(s){
    var r=rate(s); if(!r||!r.n) return "";
    return '<tr><td>'+displayRoundDate((s.date||"").slice(0,10))+'</td><td>'+r.ok+'/'+r.n+'</td><td>'+skillPct(r.ok,r.n)+'</td></tr>';
  }).filter(Boolean).join("");
  return rows?'<table class="sum" style="margin-top:12px"><thead><tr><th>'+(title||"Séance")+'</th><th>Essais</th><th>Taux</th></tr></thead><tbody>'+rows+'</tbody></table>':"";
}
function skillBand(d){ return d<4?"moins de 4 m":d<7?"4 à 7 m":d<11?"7 à 11 m":"plus de 11 m"; }
function skillStats(from,to){
  var inR=function(d){ d=(d||"").slice(0,10); return (!from||d>=from)&&(!to||d<=to); };
  var log=puttingLog().filter(function(s){ return inR(s.date); });
  var byKind=function(k){ return log.filter(function(s){ return puttingKinds[s.id]===k; }); };
  var html="", okOf=function(s){ return {n:s.results.length,ok:s.results.filter(function(r){return r.ok;}).length}; };

  /* ---------- LIGNE DE DÉPART : portes + visée ---------- */
  var gates=byKind("gate"), aims=byKind("aim");
  if(gates.length||aims.length){
    var g={n:0,ok:0,G:0,D:0}, perDrill={}, perTol={};
    gates.forEach(function(s){
      var dn=puttingCatalog[s.id][1], tol=(s.setup&&s.setup.gate)?s.setup.gate:null;
      s.results.forEach(function(r){
        g.n++; if(r.ok) g.ok++;
        if(r.label==="Raté gauche") g.G++;
        if(r.label==="Raté droite") g.D++;
        var a=perDrill[dn]||(perDrill[dn]={n:0,ok:0}); a.n++; if(r.ok) a.ok++;
        if(tol){ var b=perTol[tol]||(perTol[tol]={n:0,ok:0}); b.n++; if(r.ok) b.ok++; }
      });
    });
    var am={n:0,ok:0,sum:0,bias:0};
    aims.forEach(function(s){ s.results.forEach(function(r){
      am.n++; if(r.ok) am.ok++; am.sum+=r.error||0; am.bias+=(r.rest||0); }); });
    html+='<div class="card"><p class="label">Compétence · Ligne de départ</p><table class="sum"><tbody>'+
      (g.n?skillRow("Passages à la porte",g.ok,g.n):"")+
      (g.n?'<tr><td>Ratés gauche / droite</td><td>'+g.G+' / '+g.D+'</td><td></td></tr>':"")+
      Object.keys(perDrill).map(function(k){return skillRow(k,perDrill[k].ok,perDrill[k].n);}).join("")+
      Object.keys(perTol).map(function(k){return skillRow("Tolérance "+k,perTol[k].ok,perTol[k].n);}).join("")+
      (am.n?skillRow("Visée sous 0,7°",am.ok,am.n,"angle moyen "+(am.sum/am.n).toFixed(2).replace(".",",")+"°"):"")+
      (am.n?'<tr><td>Biais de visée</td><td>'+(am.bias/am.n).toFixed(1).replace(".",",")+' cm</td><td>'+((am.bias/am.n)<0?"gauche":"droite")+'</td></tr>':"")+
      '</tbody></table>'+skillTrend(gates,okOf,"Séance de porte")+'</div>';
  }

  /* ---------- LECTURE : pente estimée, porte de lecture, charte ---------- */
  var slopes=byKind("slope"), reads=byKind("read"), charts=byKind("chart");
  if(slopes.length||reads.length||charts.length){
    var sl={n:0,sens:0,great:0,err:0,inv:0};
    slopes.forEach(function(s){ s.results.forEach(function(r){
      sl.n++; if(!r.inverse) sl.sens++; if(r.ok) sl.great++; sl.err+=r.error||0; if(r.inverse) sl.inv++; }); });
    var rd={n:0,bonne:0,sous:0,sur:0,porte:0,bas:0,haut:0};
    reads.forEach(function(s){ s.results.forEach(function(r){
      rd.n++;
      if(r.label==="Bonne") rd.bonne++; else if(r.label==="Sous-lue") rd.sous++; else if(r.label==="Sur-lue") rd.sur++;
      if(r.gate==="Passée") rd.porte++; else if(r.gate==="Côté bas") rd.bas++; else if(r.gate==="Côté haut") rd.haut++; }); });
    var ch={n:0,ok:0,err:0,bias:0};
    charts.forEach(function(s){ s.results.forEach(function(r){
      ch.n++; if(r.ok) ch.ok++; ch.err+=r.error||0; ch.bias+=((r.guess||0)-(r.actual||0)); }); });
    html+='<div class="card"><p class="label">Compétence · Lecture de green</p><table class="sum"><tbody>'+
      (sl.n?skillRow("Sens de pente correct",sl.sens,sl.n,"erreur moyenne "+(sl.err/sl.n).toFixed(2).replace(".",",")+" pt"):"")+
      (sl.n?skillRow("Lecture Great (≤ 0,3 pt)",sl.great,sl.n):"")+
      (sl.inv?'<tr style="color:var(--red);font-weight:700"><td>Sens inversé</td><td>'+sl.inv+'/'+sl.n+'</td><td>'+skillPct(sl.inv,sl.n)+'</td></tr>':"")+
      (rd.n?skillRow("Bonne lecture à la porte",rd.bonne,rd.n):"")+
      (rd.n?'<tr><td>Sous-lue / sur-lue</td><td>'+rd.sous+' / '+rd.sur+'</td><td></td></tr>':"")+
      (rd.n?'<tr><td>Première balle passée</td><td>'+rd.porte+'/'+rd.n+'</td><td>'+skillPct(rd.porte,rd.n)+'</td></tr>':"")+
      (ch.n?skillRow("Visée dans 2,5 cm (charte)",ch.ok,ch.n,"écart moyen "+(ch.err/ch.n).toFixed(1).replace(".",",")+" cm"):"")+
      (ch.n?'<tr><td>Biais de charte</td><td>'+(ch.bias/ch.n).toFixed(1).replace(".",",")+' cm</td><td>'+((ch.bias/ch.n)<0?"trop à gauche":"trop à droite")+'</td></tr>':"")+
      '</tbody></table>'+
      skillTrend(slopes.concat(reads).concat(charts).sort(function(a,b){return (b.date||"").localeCompare(a.date||"");}),okOf,"Séance de lecture")+
      '<p class="muted" style="margin-top:10px">Le sens inversé est le compteur à suivre : c’est l’erreur qui coûte le plus cher au putting.</p></div>';
  }

  /* ---------- DOSAGE : zone de bonne vitesse, échelle, défis ---------- */
  var speeds=byKind("speed"), zones=byKind("zone");
  var ladders=(S.ladderSessions||[]).filter(function(s){ return inR(s.date); });
  if(speeds.length||zones.length||ladders.length){
    var sp={n:0,ok:0,court:0,long:0}, perBand={};
    speeds.forEach(function(s){ s.results.forEach(function(r){
      sp.n++; if(r.ok) sp.ok++;
      if(r.label==="Court") sp.court++; if(r.label==="Long") sp.long++;
      var b=perBand[skillBand(r.d)]||(perBand[skillBand(r.d)]={n:0,ok:0}); b.n++; if(r.ok) b.ok++; }); });
    var la={n:0,ok:0,court:0,long:0}, perDist={};
    ladders.forEach(function(s){ s.results.forEach(function(lab,i){
      var d=ladderDistances[Math.floor(i/3)];
      la.n++; if(lab==="Dans la zone") la.ok++;
      if(lab==="Court") la.court++; if(lab==="Long") la.long++;
      var b=perDist[d+" m"]||(perDist[d+" m"]={n:0,ok:0}); b.n++; if(lab==="Dans la zone") b.ok++; }); });
    var zo={n:0,ok:0};
    zones.forEach(function(s){ s.results.forEach(function(r){ zo.n++; if(r.ok) zo.ok++; }); });
    html+='<div class="card"><p class="label">Compétence · Dosage</p><table class="sum"><tbody>'+
      (sp.n?skillRow("Bonne vitesse (zone Tour)",sp.ok,sp.n):"")+
      (sp.n?'<tr><td>Ratés courts / longs</td><td>'+sp.court+' / '+sp.long+'</td><td></td></tr>':"")+
      Object.keys(perBand).map(function(k){return skillRow("Vitesse · "+k,perBand[k].ok,perBand[k].n);}).join("")+
      (la.n?skillRow("Échelle · dans la zone",la.ok,la.n):"")+
      (la.n?'<tr><td>Échelle · courts / longs</td><td>'+la.court+' / '+la.long+'</td><td></td></tr>':"")+
      Object.keys(perDist).map(function(k){return skillRow("Échelle · "+k,perDist[k].ok,perDist[k].n);}).join("")+
      (zo.n?skillRow("Défis de dosage · zone tenue",zo.ok,zo.n):"")+
      '</tbody></table>'+
      skillTrend(speeds.concat(zones).sort(function(a,b){return (b.date||"").localeCompare(a.date||"");}),okOf,"Séance de dosage")+
      skillTrend(ladders,function(s){ return {n:s.results.length,ok:s.results.filter(function(l){return l==="Dans la zone";}).length}; },"Échelle de vitesse")+
      '</div>';
  }

  return html||'<div class="card"><p class="label">Compétences</p><p class="muted">Aucune séance de ligne, de lecture ou de dosage sur cette période.</p></div>';
}
